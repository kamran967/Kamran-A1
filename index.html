<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kamran A1</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#03060b;
  color:#fff;
  font-family:Arial,"Noto Sans Arabic",sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:900px;
  min-height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 8%,rgba(0,174,255,.14),transparent 30%),
    linear-gradient(180deg,#08101b 0%,#03060b 55%,#020408 100%);
}

/* HEADER */

.header{
  padding:18px 15px 13px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(3,6,11,.82);
  backdrop-filter:blur(18px);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  background:linear-gradient(145deg,#172a43,#080d16);
  border:1px solid rgba(125,211,252,.18);
  box-shadow:0 0 28px rgba(0,180,255,.16);
}

.title{
  font-size:27px;
  font-weight:700;
}

.title span{
  color:#72d7ff;
}

.subtitle{
  margin-top:4px;
  color:#68778d;
  font-size:10px;
  letter-spacing:2px;
}

.status{
  display:inline-block;
  margin-top:12px;
  padding:7px 17px;
  border-radius:50px;
  font-size:13px;
  color:#9aa8ba;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
}

.status.listen{
  color:#65f5a3;
  background:rgba(34,197,94,.08);
  border-color:rgba(34,197,94,.3);
}

.status.speak{
  color:#6ed8ff;
  background:rgba(14,165,233,.08);
  border-color:rgba(14,165,233,.3);
}

.status.think{
  color:#f5d878;
  background:rgba(234,179,8,.07);
  border-color:rgba(234,179,8,.25);
}

.status.error{
  color:#ff9292;
  background:rgba(239,68,68,.07);
  border-color:rgba(239,68,68,.3);
}

/* ORB */

.orb-area{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.orb{
  width:125px;
  height:125px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  background:
    radial-gradient(circle at 35% 28%,#e6f9ff 0%,#69d8ff 8%,#12698c 35%,#06151e 67%,#020509 100%);
  border:1px solid rgba(125,211,252,.35);
  box-shadow:
    0 0 25px rgba(14,165,233,.28),
    0 0 65px rgba(14,165,233,.12),
    inset 0 0 25px rgba(125,211,252,.12);
  transition:.3s;
}

.orb:before,
.orb:after{
  content:"";
  position:absolute;
  inset:-12px;
  border-radius:50%;
  border:1px solid rgba(56,189,248,.14);
  animation:pulse 3s infinite;
}

.orb:after{
  inset:-23px;
  border-color:rgba(56,189,248,.06);
  animation-delay:1s;
}

.orb.active{
  box-shadow:
    0 0 35px rgba(34,197,94,.42),
    0 0 90px rgba(34,197,94,.18),
    inset 0 0 28px rgba(255,255,255,.12);
}

.orb.speaking{
  box-shadow:
    0 0 35px rgba(56,189,248,.5),
    0 0 100px rgba(56,189,248,.2),
    inset 0 0 28px rgba(255,255,255,.12);
}

@keyframes pulse{
  0%,100%{transform:scale(.94);opacity:.45}
  50%{transform:scale(1.04);opacity:.9}
}

/* CHAT */

.chat{
  flex:1;
  padding:0 13px 125px;
}

.message{
  display:flex;
  margin:9px 0;
}

.message.user{
  justify-content:flex-start;
}

.message.ai{
  justify-content:flex-end;
}

.bubble{
  max-width:84%;
  padding:12px 15px;
  border-radius:18px;
  line-height:1.65;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:linear-gradient(135deg,#112238,#0a1421);
  border:1px solid rgba(125,211,252,.12);
  border-bottom-left-radius:5px;
}

.ai .bubble{
  background:linear-gradient(135deg,#0e1721,#080d14);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-right-radius:5px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(3,6,11,.92);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.08);
}

.bottom-inner{
  max-width:900px;
  margin:auto;
}

.input-row{
  display:flex;
  gap:7px;
  direction:rtl;
}

.input{
  flex:1;
  min-width:0;
  height:47px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  color:#fff;
  background:#0a1019;
  padding:0 14px;
  font-size:15px;
  direction:rtl;
}

.input::placeholder{
  color:#637085;
}

.send{
  width:50px;
  height:47px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-size:20px;
  background:linear-gradient(145deg,#087aa8,#07506f);
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:7px;
  direction:ltr;
}

.control{
  height:43px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:13px;
  color:#dce8f5;
  background:#0a1019;
  font-size:13px;
  font-weight:600;
}

.control.voice{
  border-color:rgba(56,189,248,.24);
}

.control.wake{
  border-color:rgba(34,197,94,.22);
}

.control.wake.on{
  color:#6ff5a5;
  background:rgba(34,197,94,.1);
  border-color:rgba(34,197,94,.42);
}

.control.stop{
  border-color:rgba(239,68,68,.2);
}

.control:active,
.send:active{
  transform:scale(.97);
}

/* DESKTOP */

@media(min-width:700px){
  .bottom{
    padding-left:20px;
    padding-right:20px;
  }

  .bubble{
    max-width:70%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="logo">🤖</div>

      <div>
        <div class="title">Kamran <span>A1</span></div>
        <div class="subtitle">PERSONAL AI ASSISTANT</div>
      </div>
    </div>

    <div id="status" class="status">
      تیار ہوں
    </div>

  </header>

  <div class="orb-area">
    <div id="orb" class="orb">◉</div>
  </div>

  <main id="chat" class="chat"></main>

</div>

<div class="bottom">

  <div class="bottom-inner">

    <div class="input-row">

      <input
        id="textInput"
        class="input"
        type="text"
        placeholder="اپنا سوال لکھیں..."
        autocomplete="off"
      >

      <button
        id="sendBtn"
        class="send"
        type="button"
      >
        ➤
      </button>

    </div>

    <div class="controls">

      <button
        id="voiceBtn"
        class="control voice"
        type="button"
      >
        🎙️ Voice
      </button>

      <button
        id="wakeBtn"
        class="control wake"
        type="button"
      >
        🟢 Jarvis Wake
      </button>

      <button
        id="stopBtn"
        class="control stop"
        type="button"
      >
        ⛔ Stop
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   KAMRAN A1
   COMPLETE FRONTEND
   ========================================================= */


/* -----------------------------
   WORKER
----------------------------- */

const WORKER_URL =
  "https://kamran1.jeekamran48.workers.dev";


/* -----------------------------
   STORAGE
----------------------------- */

const MEMORY_KEY = "kamran_memory";
const HISTORY_KEY = "kamran_history";


/* -----------------------------
   ELEMENTS
----------------------------- */

const chat =
  document.getElementById("chat");

const textInput =
  document.getElementById("textInput");

const sendBtn =
  document.getElementById("sendBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const wakeBtn =
  document.getElementById("wakeBtn");

const stopBtn =
  document.getElementById("stopBtn");

const statusEl =
  document.getElementById("status");

const orb =
  document.getElementById("orb");


/* -----------------------------
   MEMORY
----------------------------- */

let memory = [];

let history = [];

try{
  const savedMemory =
    localStorage.getItem(MEMORY_KEY);

  if(savedMemory){
    const parsed =
      JSON.parse(savedMemory);

    if(Array.isArray(parsed)){
      memory = parsed;
    }
  }
}catch(e){
  memory = [];
}


try{
  const savedHistory =
    localStorage.getItem(HISTORY_KEY);

  if(savedHistory){
    const parsed =
      JSON.parse(savedHistory);

    if(Array.isArray(parsed)){
      history = parsed;
    }
  }
}catch(e){
  history = [];
}


/* -----------------------------
   SPEECH RECOGNITION
----------------------------- */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let recognitionMode = "idle";

let wakeEnabled = false;

let recognitionRunning = false;

let processingCommand = false;

let commandReceived = false;

let pendingWake = false;

let manualListening = false;

let returnToWakeAfterManual = false;

let restartTimer = null;


/* -----------------------------
   SPEECH SYNTHESIS
----------------------------- */

let speaking = false;


/* =========================================================
   UI FUNCTIONS
   ========================================================= */

function setStatus(text, type){

  statusEl.textContent = text;

  statusEl.className = "status";

  if(type){
    statusEl.classList.add(type);
  }
}


function addMessage(text, who){

  const row =
    document.createElement("div");

  row.className =
    "message " + who;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  row.appendChild(bubble);

  chat.appendChild(row);

  setTimeout(function(){

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  },50);
}


function saveHistory(){

  try{

    history =
      history.slice(-40);

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history)
    );

  }catch(e){}
}


function saveMemory(){

  try{

    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(memory)
    );

  }catch(e){}
}


/* =========================================================
   LOCAL MEMORY
   ========================================================= */

function remember(type,value){

  memory.push({
    type:String(type),
    value:String(value)
  });

  memory =
    memory.slice(-30);

  saveMemory();
}


function localCommand(text){

  const t =
    String(text)
      .trim()
      .toLowerCase();

  /* NAME */

  if(
    t.includes("میرا نام کیا ہے") ||
    t.includes("mera naam kya hai") ||
    t.includes("what is my name")
  ){

    const found =
      memory.find(function(item){

        return (
          item &&
          item.type === "name"
        );

      });

    if(found){
      return "آپ کا نام " +
        found.value +
        " ہے۔";
    }

    return "مجھے ابھی آپ کا نام یاد نہیں ہے۔";
  }


  /* REMEMBER NAME */

  const nameMatch =
    text.match(
      /(?:میرا نام|mera naam|my name is)\s*(?:ہے|is)?\s*([A-Za-z\u0600-\u06FF ]{2,40})/i
    );

  if(nameMatch){

    let name =
      nameMatch[1]
        .trim()
        .replace(/[۔.!؟?]+$/,"")
        .trim();

    if(name){

      remember("name",name);

      return (
        "ٹھیک ہے، میں یاد رکھوں گا کہ آپ کا نام " +
        name +
        " ہے۔"
      );
    }
  }


  /* SIMPLE REMEMBER */

  if(
    t.startsWith("یاد رکھو") ||
    t.startsWith("یاد رکھنا") ||
    t.startsWith("remember")
  ){

    return null;
  }

  return null;
}


/* =========================================================
   SPEAK
   ========================================================= */

function stopSpeaking(){

  try{
    window.speechSynthesis.cancel();
  }catch(e){}

  speaking = false;

  orb.classList.remove("speaking");
}


function speak(text){

  return new Promise(function(resolve){

    if(!text){

      resolve();
      return;
    }

    stopSpeaking();

    if(
      !("speechSynthesis" in window) ||
      !("SpeechSynthesisUtterance" in window)
    ){

      resolve();
      return;
    }

    speaking = true;

    orb.classList.add("speaking");

    setStatus(
      "بول رہا ہوں...",
      "speak"
    );

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "ur-PK";

    utterance.rate = 0.92;

    utterance.pitch = 1;

    utterance.volume = 1;

    let finished = false;

    const finish =
      function(){

        if(finished){
          return;
        }

        finished = true;

        speaking = false;

        orb.classList.remove("speaking");

        resolve();

      };

    utterance.onend = finish;

    utterance.onerror = finish;

    try{

      window.speechSynthesis.speak(
        utterance
      );

    }catch(e){

      finish();

    }

    /* Safety fallback */

    setTimeout(
      finish,
      Math.max(
        5000,
        Math.min(
          15000,
          text.length * 85
        )
      )
    );

  });

}


/* =========================================================
   AI REQUEST
   ========================================================= */

async function askAI(text){

  const local =
    localCommand(text);

  if(local){

    addMessage(local,"ai");

    history.push({
      role:"user",
      content:text
    });

    history.push({
      role:"assistant",
      content:local
    });

    saveHistory();

    await speak(local);

    return local;
  }


  setStatus(
    "سوچ رہا ہوں...",
    "think"
  );

  try{

    const response =
      await fetch(
        WORKER_URL + "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            memory:
              memory.slice(-12),

            history:
              history.slice(-20)

          })
        }
      );


    const data =
      await response
        .json()
        .catch(function(){
          return {};
        });


    if(!response.ok){

      throw new Error(
        data.error ||
        "Worker error: " +
        response.status
      );

    }


    const reply =
      String(
        data.reply || ""
      ).trim();


    if(!reply){

      throw new Error(
        "AI نے خالی جواب دیا۔"
      );

    }


    history.push({
      role:"user",
      content:text
    });

    history.push({
      role:"assistant",
      content:reply
    });

    saveHistory();

    addMessage(
      reply,
      "ai"
    );

    await speak(reply);

    return reply;

  }catch(error){

    console.error(error);

    const message =
      "AI سے رابطہ نہیں ہو سکا۔\n" +
      error.message;

    addMessage(
      message,
      "ai"
    );

    setStatus(
      "رابطے میں مسئلہ",
      "error"
    );

    return null;
  }
}


/* =========================================================
   SEND TEXT
   ========================================================= */

async function sendText(text){

  text =
    String(text || "")
      .trim();

  if(!text){
    return;
  }

  addMessage(
    text,
    "user"
  );

  textInput.value = "";

  await askAI(text);

  if(wakeEnabled){

    setTimeout(
      function(){

        startWakeRecognition();

      },
      900
    );

  }else{

    setStatus("تیار ہوں");

  }
}


/* =========================================================
   JARVIS DETECTION
   ========================================================= */

function isJarvis(text){

  const original =
    String(text || "")
      .trim()
      .toLowerCase();

  const compact =
    original
      .replace(/\s+/g,"")
      .replace(/[.,!?؟،۔]/g,"");


  const patterns = [

    "jarvis",
    "jar viz",
    "jar vis",
    "jarwis",
    "jarvish",
    "jervis",
    "jervish",

    "جاروِس",
    "جاروس",
    "جارو س",
    "جار وس",
    "جارووس",
    "جاروس"

  ];


  for(
    let i=0;
    i<patterns.length;
    i++
  ){

    const p =
      patterns[i]
        .toLowerCase();

    if(
      original.includes(p) ||
      compact.includes(
        p.replace(/\s+/g,"")
      )
    ){
      return true;
    }
  }

  return false;
}


/* =========================================================
   CREATE RECOGNITION
   ========================================================= */

function createRecognition(){

  if(!SpeechRecognition){

    setStatus(
      "Voice supported نہیں",
      "error"
    );

    voiceBtn.disabled = true;

    wakeBtn.disabled = true;

    return null;
  }


  const r =
    new SpeechRecognition();


  r.continuous = false;

  r.interimResults = false;

  r.maxAlternatives = 5;


  r.onstart =
    function(){

      recognitionRunning = true;

      if(
        recognitionMode === "wake"
      ){

        setStatus(
          "Jarvis سن رہا ہے...",
          "listen"
        );

        orb.classList.add("active");

      }else if(
        recognitionMode === "command"
      ){

        setStatus(
          "میں سن رہا ہوں...",
          "listen"
        );

        orb.classList.add("active");

      }

    };


  r.onresult =
    function(event){

      let transcript = "";


      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        if(
          event.results[i].isFinal
        ){

          transcript +=
            event.results[i][0].transcript +
            " ";

        }

      }


      transcript =
        transcript.trim();


      if(!transcript){
        return;
      }


      console.log(
        "Speech:",
        transcript,
        "Mode:",
        recognitionMode
      );


      /* WAKE */

      if(
        recognitionMode === "wake"
      ){

        if(
          isJarvis(transcript)
        ){

          pendingWake = true;

          try{
            r.stop();
          }catch(e){}

        }

        return;
      }


      /* COMMAND */

      if(
        recognitionMode === "command"
      ){

        if(processingCommand){
          return;
        }

        commandReceived = true;

        processingCommand = true;

        try{
          r.stop();
        }catch(e){}

        handleCommand(
          transcript
        );

      }

    };


  r.onerror =
    function(event){

      console.log(
        "Recognition error:",
        event.error
      );

      recognitionRunning = false;

      orb.classList.remove("active");


      if(
        event.error ===
          "not-allowed" ||
        event.error ===
          "service-not-allowed"
      ){

        setStatus(
          "Microphone permission دیں",
          "error"
        );

        wakeEnabled = false;

        updateWakeButton();

        return;
      }


      if(
        event.error ===
          "aborted"
      ){

        return;
      }


      if(
        recognitionMode === "wake" &&
        wakeEnabled
      ){

        scheduleWakeRestart();

      }else if(
        recognitionMode === "command" &&
        !commandReceived &&
        !processingCommand
      ){

        if(wakeEnabled){

          scheduleWakeRestart();

        }else{

          setStatus(
            "تیار ہوں"
          );

        }

      }

    };


  r.onend =
    function(){

      recognitionRunning = false;

      orb.classList.remove("active");


      /* WAKE DETECTED */

      if(pendingWake){

        pendingWake = false;

        recognitionMode =
          "idle";

        handleWakeDetected();

        return;
      }


      /* COMMAND ENDED */

      if(
        recognitionMode === "command"
      ){

        if(
          !commandReceived &&
          !processingCommand
        ){

          recognitionMode =
            "idle";

          if(wakeEnabled){

            scheduleWakeRestart();

          }else{

            setStatus(
              "تیار ہوں"
            );

          }

        }

        return;
      }


      /* WAKE ENDED */

      if(
        recognitionMode === "wake" &&
        wakeEnabled
      ){

        scheduleWakeRestart();

      }

    };


  return r;
}


/* =========================================================
   START RECOGN
