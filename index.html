<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Kamran A1</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05080d;
  color:#fff;
  font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  padding-bottom:125px;
}

/* ================= TOP ================= */

.topbar{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,8,13,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,255,255,.08);
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:.5px;
}

.logo span{
  color:#00eaff;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(0,234,255,.35);
  background:#0b111a;
  color:#fff;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* ================= ORB ================= */

.orb-area{
  display:flex;
  justify-content:center;
  padding:22px 0 12px;
}

.orb{
  width:95px;
  height:95px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#ffffff 0%,#5df5ff 7%,#008cff 35%,#07142d 68%,#02050a 100%);
  box-shadow:
    0 0 20px #00eaff,
    0 0 55px rgba(0,180,255,.35),
    inset 0 0 25px rgba(255,255,255,.3);
  transition:.25s;
}

.orb.listening{
  box-shadow:
    0 0 30px #00ffb7,
    0 0 80px rgba(0,255,183,.45),
    inset 0 0 30px rgba(255,255,255,.35);
}

.orb.speaking{
  box-shadow:
    0 0 30px #b600ff,
    0 0 80px rgba(182,0,255,.45),
    inset 0 0 30px rgba(255,255,255,.35);
}

.status{
  text-align:center;
  min-height:25px;
  color:#8ea5b8;
  font-size:13px;
  padding:2px 15px 12px;
}

/* ================= CHAT ================= */

.chat{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:5px 12px 15px;
}

.message{
  display:flex;
  margin:9px 0;
}

.message.user{
  justify-content:flex-start;
}

.message.ai{
  justify-content:flex-end;
}

.bubble{
  max-width:86%;
  padding:12px 15px;
  border-radius:17px;
  line-height:1.7;
  font-size:15px;
  word-break:break-word;
  white-space:normal;
}

.message.user .bubble{
  background:#102235;
  border:1px solid rgba(0,180,255,.18);
  border-bottom-right-radius:5px;
}

.message.ai .bubble{
  background:#0c121b;
  border:1px solid rgba(0,234,255,.12);
  border-bottom-left-radius:5px;
}

/* AI Markdown */

.bubble strong{
  font-weight:800;
  color:#fff;
}

.bubble em{
  font-style:italic;
}

.bubble code{
  direction:ltr;
  unicode-bidi:embed;
  background:#02060a;
  padding:2px 6px;
  border-radius:5px;
  font-family:monospace;
  font-size:13px;
}

.bubble .bullet{
  display:block;
  margin:3px 0;
}

/* ================= BOTTOM ================= */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(5,8,13,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid rgba(0,234,255,.1);
}

.input-row{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:7px;
  align-items:center;
}

.input{
  flex:1;
  min-width:0;
  height:48px;
  border-radius:25px;
  border:1px solid #1c3546;
  background:#09111a;
  color:#fff;
  padding:0 17px;
  outline:none;
  font-size:15px;
  direction:rtl;
}

.input:focus{
  border-color:#00bcd4;
}

.send{
  width:48px;
  height:48px;
  border-radius:50%;
  border:0;
  background:#00bcd4;
  color:#001015;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.controls{
  max-width:850px;
  margin:8px auto 0;
  display:flex;
  justify-content:center;
  gap:8px;
}

.control{
  flex:1;
  max-width:150px;
  height:38px;
  border-radius:20px;
  border:1px solid #203746;
  background:#0b141d;
  color:#d8e8ef;
  cursor:pointer;
  font-size:13px;
}

.control.active{
  border-color:#00eaff;
  color:#00eaff;
  background:#09202a;
}

.control.stop{
  border-color:#71313a;
  color:#ff8d98;
}

/* ================= SETTINGS ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  padding:25px 15px;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.settings{
  width:100%;
  max-width:430px;
  background:#0a1018;
  border:1px solid #1b3545;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 70px rgba(0,0,0,.65);
}

.settings-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.settings h2{
  margin:0;
  font-size:20px;
}

.close{
  width:35px;
  height:35px;
  border-radius:50%;
  border:1px solid #294050;
  background:#101922;
  color:#fff;
  cursor:pointer;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.setting-info strong{
  display:block;
  font-size:15px;
}

.setting-info small{
  color:#8499a6;
  font-size:11px;
}

.switch{
  position:relative;
  width:48px;
  height:26px;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  background:#27323b;
  border-radius:30px;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#00a8bd;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

.setting-action{
  width:100%;
  height:43px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #293d4a;
  background:#101923;
  color:#fff;
  cursor:pointer;
}

.setting-action.danger{
  border-color:#68343b;
  color:#ff9ba4;
}

/* ================= SMALL SCREEN ================= */

@media(max-width:420px){
  .bubble{
    max-width:91%;
    font-size:14px;
  }

  .control{
    font-size:11px;
  }

  .orb{
    width:82px;
    height:82px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="logo">
      Kamran <span>A1</span>
    </div>

    <button class="icon-btn" id="settingsBtn">⚙</button>
  </div>

  <div class="orb-area">
    <div class="orb" id="orb"></div>
  </div>

  <div class="status" id="status">
    تیار ہوں
  </div>

  <div class="chat" id="chat"></div>

</div>


<!-- ================= BOTTOM ================= -->

<div class="bottom">

  <div class="input-row">

    <input
      id="input"
      class="input"
      type="text"
      autocomplete="off"
      placeholder="کچھ لکھیں..."
    >

    <button class="send" id="sendBtn">➤</button>

  </div>

  <div class="controls">

    <button class="control" id="voiceBtn">
      🎙 Voice
    </button>

    <button class="control" id="wakeBtn">
      🟢 Kamran Wake
    </button>

    <button class="control stop" id="stopBtn">
      ⛔ Stop
    </button>

  </div>

</div>


<!-- ================= SETTINGS ================= -->

<div class="modal" id="settingsModal">

  <div class="settings">

    <div class="settings-head">
      <h2>Settings</h2>
      <button class="close" id="closeSettings">×</button>
    </div>

    <div class="setting-row">

      <div class="setting-info">
        <strong>Voice Response</strong>
        <small>AI کا جواب آواز میں سنائیں</small>
      </div>

      <label class="switch">
        <input type="checkbox" id="voiceSetting" checked>
        <span class="slider"></span>
      </label>

    </div>


    <div class="setting-row">

      <div class="setting-info">
        <strong>Kamran Wake</strong>
        <small>Kamran بول کر assistant activate کریں</small>
      </div>

      <label class="switch">
        <input type="checkbox" id="wakeSetting">
        <span class="slider"></span>
      </label>

    </div>


    <div class="setting-row">

      <div class="setting-info">
        <strong>Local Memory</strong>
        <small>نام اور basic memory browser میں محفوظ کریں</small>
      </div>

      <label class="switch">
        <input type="checkbox" id="memorySetting" checked>
        <span class="slider"></span>
      </label>

    </div>


    <button class="setting-action" id="clearChat">
      Chat صاف کریں
    </button>

    <button class="setting-action danger" id="clearMemory">
      Local Memory صاف کریں
    </button>

  </div>

</div>


<script>

/* =========================================================
   KAMRAN A1
   COMPLETE WAKE + MEMORY + MARKDOWN VERSION
   ========================================================= */


/* ================= CONFIG ================= */

const WORKER_URL =
  "https://kamran1.jeekamran48.workers.dev";

const MEMORY_KEY =
  "kamran_memory_v2";

const HISTORY_KEY =
  "kamran_history_v2";

const SETTINGS_KEY =
  "kamran_settings_v2";


/* ================= ELEMENTS ================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const wakeBtn =
  document.getElementById("wakeBtn");

const stopBtn =
  document.getElementById("stopBtn");

const status =
  document.getElementById("status");

const orb =
  document.getElementById("orb");

const settingsBtn =
  document.getElementById("settingsBtn");

const settingsModal =
  document.getElementById("settingsModal");

const closeSettings =
  document.getElementById("closeSettings");

const voiceSetting =
  document.getElementById("voiceSetting");

const wakeSetting =
  document.getElementById("wakeSetting");

const memorySetting =
  document.getElementById("memorySetting");

const clearChat =
  document.getElementById("clearChat");

const clearMemory =
  document.getElementById("clearMemory");


/* ================= STATE ================= */

let memory = [];
let history = [];

let speaking = false;

let recognition = null;

/*
  Wake system states:

  idle
  wake
  command-pending
  command
  processing
*/

let recognitionState = "idle";

let wakeEnabled = false;

let manualStop = false;

let processing = false;

let restartTimer = null;


/* ================= SETTINGS ================= */

let settings = {
  voice: true,
  wake: false,
  memory: true
};


try{

  const savedSettings =
    JSON.parse(
      localStorage.getItem(SETTINGS_KEY) || "{}"
    );

  settings = {
    ...settings,
    ...savedSettings
  };

}catch(e){}


voiceSetting.checked =
  settings.voice;

wakeSetting.checked =
  settings.wake;

memorySetting.checked =
  settings.memory;


/* ================= LOAD MEMORY ================= */

try{

  memory =
    JSON.parse(
      localStorage.getItem(MEMORY_KEY) || "[]"
    );

  if(!Array.isArray(memory)){
    memory = [];
  }

}catch(e){

  memory = [];

}


/* ================= LOAD HISTORY ================= */

try{

  history =
    JSON.parse(
      localStorage.getItem(HISTORY_KEY) || "[]"
    );

  if(!Array.isArray(history)){
    history = [];
  }

}catch(e){

  history = [];

}


/* ================= SAVE SETTINGS ================= */

function saveSettings(){

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(settings)
  );

}


/* ================= SAVE MEMORY ================= */

function saveMemory(){

  if(!settings.memory) return;

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


/* ================= SAVE HISTORY ================= */

function saveHistory(){

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history.slice(-50))
  );

}


/* =========================================================
   SAFE MARKDOWN
   ========================================================= */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function formatAIText(text){

  let s =
    escapeHTML(text);


  /*
    Bold:
    **text**
  */

  s =
    s.replace(
      /\*\*([\s\S]*?)\*\*/g,
      "<strong>$1</strong>"
    );


  /*
    Italic:
    *text*
  */

  s =
    s.replace(
      /(^|[^\*])\*([^\*]+)\*(?!\*)/g,
      "$1<em>$2</em>"
    );


  /*
    Inline code
  */

  s =
    s.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  /*
    Bullets
  */

  s =
    s.replace(
      /^[•\-]\s+(.+)$/gm,
      '<span class="bullet">• $1</span>'
    );


  /*
    New lines
  */

  s =
    s.replace(
      /\n/g,
      "<br>"
    );


  return s;

}


/* =========================================================
   CHAT MESSAGE
   ========================================================= */

function addMessage(text, who){

  const row =
    document.createElement("div");

  row.className =
    "message " + who;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(who === "ai"){

    /*
      AI response کو safely format کریں
      تاکہ ** نظر نہ آئے
    */

    bubble.innerHTML =
      formatAIText(text);

  }else{

    bubble.textContent =
      String(text);

  }


  row.appendChild(bubble);

  chat.appendChild(row);


  setTimeout(() => {

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  },30);

}


/* =========================================================
   RESTORE CHAT
   ========================================================= */

function restoreHistory(){

  chat.innerHTML = "";

  history
    .slice(-50)
    .forEach(item => {

      if(
        item &&
        item.role &&
        item.content
      ){

        addMessage(
          item.content,
          item.role === "user"
            ? "user"
            : "ai"
        );

      }

    });

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text){

  status.textContent =
    text;

}


/* =========================================================
   ORB
   ========================================================= */

function orbListening(){

  orb.classList.add("listening");

  orb.classList.remove("speaking");

}


function orbSpeaking(){

  orb.classList.add("speaking");

  orb.classList.remove("listening");

}


function orbNormal(){

  orb.classList.remove("listening");

  orb.classList.remove("speaking");

}


/* =========================================================
   SPEECH SYNTHESIS
   ========================================================= */

function stopSpeaking(){

  try{

    speechSynthesis.cancel();

  }catch(e){}

  speaking = false;

  orbNormal();

}


function speak(text){

  if(!settings.voice) return;

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  stopSpeaking();


  const clean =
    String(text)
      .replace(/\*\*/g,"")
      .replace(/[`#]/g,"")
      .replace(/<[^>]*>/g,"")
      .trim();


  if(!clean) return;


  const utterance =
    new SpeechSynthesisUtterance(clean);


  utterance.lang =
    "ur-PK";

  utterance.rate =
    0.95;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  utterance.onstart = () => {

    speaking = true;

    orbSpeaking();

    setStatus("بول رہا ہوں...");

  };


  utterance.onend = () => {

    speaking = false;

    orbNormal();

    if(wakeEnabled){

      setStatus("Kamran بولیں...");

    }else{

      setStatus("تیار ہوں");

    }

  };


  utterance.onerror = () => {

    speaking = false;

    orbNormal();

  };


  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   LOCAL MEMORY
   ========================================================= */

function normalizeText(text){

  return String(text)
    .toLowerCase()
    .replace(/[؟?!,.،۔]/g,"")
    .replace(/\s+/g," ")
    .trim();

}


/* ================= NAME SAVE ================= */

function saveUserNameFromText(text){

  if(!settings.memory){
    return null;
  }


  const original =
    String(text).trim();


  /*
    Urdu:

    میرا نام کامران ہے
    میرا نام کامران

    Roman:

    mera naam Kamran hai
    mera naam Kamran

    English:

    my name is Kamran
  */

  let match =
    original.match(
      /^میرا\s+نام\s+(.+?)\s*$/i
    );


  if(!match){

    match =
      original.match(
        /^mera\s+naam\s+(.+?)\s*$/i
      );

  }


  if(!match){

    match =
      original.match(
        /^my\s+name\s+is\s+(.+?)\s*$/i
      );

  }


  if(!match){
    return null;
  }


  let name =
    match[1]
      .trim()
      .replace(
        /[۔.!؟?]+$/g,
        ""
      )
      .trim();


  /*
    آخر میں "ہے" / "hai" / "is"
    ہو تو اسے remove کریں
  */

  name =
    name.replace(
      /\s+(ہے|hai|is)$/i,
      ""
    )
    .trim();


  if(!name){
    return null;
  }


  memory =
    memory.filter(
      item =>
        item.key !== "user_name"
    );


  memory.push({
    key:"user_name",
    value:name,
    time:Date.now()
  });


  saveMemory();


  return name;

}


/* ================= NAME QUERY ================= */

function isNameQuestion(text){

  const t =
    normalizeText(text);


  return (

    t.includes("میرا نام کیا ہے") ||

    t.includes("میرا نام بتاؤ") ||

    t.includes("میرا نام بتائیں") ||

    t.includes("mera naam kya hai") ||

    t.includes("mera naam batao") ||

    t.includes("what is my name") ||

    t.includes("what's my name")

  );

}


/* ================= GET NAME ================= */

function getUserName(){

  const item =
    memory.find(
      x => x.key === "user_name"
    );


  return item
    ? item.value
    : null;

}


/* =========================================================
   LOCAL COMMANDS
   ========================================================= */

function handleLocalCommand(text){

  /*
    Name save
  */

  const savedName =
    saveUserNameFromText(text);


  if(savedName){

    return {
      handled:true,
      response:
        `ٹھیک ہے، میں یاد رکھوں گا کہ آپ کا نام ${savedName} ہے۔`
    };

  }


  /*
    Name query
  */

  if(isNameQuestion(text)){

    const name =
      getUserName();


    if(name){

      return {
        handled:true,
        response:
          `آپ کا نام ${name} ہے۔`
      };

    }


    return {
      handled:true,
      response:
        "مجھے ابھی آپ کا نام یاد نہیں ہے۔"
    };

  }


  return {
    handled:false,
    response:""
  };

}


/* =========================================================
   AI CHAT
   ========================================================= */

async function askAI(text){

  try{

    const recentMemory =
      settings.memory
        ? memory.slice(-20)
        : [];


    const recentHistory =
      history.slice(-12);


    const response =
      await fetch(
        WORKER_URL + "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:text,

              memory:
                recentMemory,

              history:
                recentHistory

            })

        }
      );


    const data =
      await response.json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.error ||
        "Worker error"
      );

    }


    /*
      مختلف possible response formats
    */

    const answer =
      data.reply ??
      data.response ??
      data.message ??
      data.answer ??
      "";


    if(!answer){

      return "مجھے اس وقت جواب نہیں ملا۔";

    }


    return String(answer);

  }catch(error){

    console.error(
      "AI ERROR:",
      error
    );


    return (
      "معذرت، اس وقت AI Worker سے رابطہ نہیں ہو سکا۔"
    );

  }

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendText(text){

  text =
    String(text || "").trim();


  if(!text) return;


  if(processing){
    return;
  }


  processing = true;


  /*
    User message
  */

  addMessage(
    text,
    "user"
  );


  history.push({
    role:"user",
    content:text
  });


  saveHistory();


  input.value = "";


  setStatus(
    "سوچ رہا ہوں..."
  );


  /*
    Local command پہلے
  */

  const local =
    handleLocalCommand(text);


  if(local.handled){

    const answer =
      local.response;


    addMessage(
      answer,
      "ai"
    );


    history.push({
      role:"assistant",
      content:answer
    });


    saveHistory();


    speak(answer);


    processing = false;


    finishCommand();


    return;

  }


  /*
    AI Worker
  */

  const answer =
    await askAI(text);


  addMessage(
    answer,
    "ai"
  );


  history.push({
    role:"assistant",
    content:answer
  });


  saveHistory();


  speak(answer);


  processing = false;


  finishCommand();

}


/* =========================================================
   COMMAND FINISH
   ========================================================= */

function finishCommand(){

  /*
    اگر Wake on ہے تو answer کے بعد
    دوبارہ Wake mode شروع ہوگا۔

    اگر Stop کیا گیا ہے تو نہیں۔
  */

  if(
    wakeEnabled &&
    !manualStop
  ){

    setStatus(
      "Kamran بولیں..."
    );


    scheduleWake();

  }else{

    recognitionState =
      "idle";

    orbNormal();

    setStatus(
      "تیار ہوں"
    );

  }

}


/* =========================================================
   SPEECH RECOGNITION SUPPORT
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "ur-PK";


  /*
    ہر cycle ایک result کے بعد ختم ہوگی۔
    ہم onend سے اگلا مناسب state شروع کریں گے۔
  */

  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    3;


  /* ================= ON START ================= */

  recognition.onstart = () => {

    if(
      recognitionState === "wake" ||
      recognitionState === "command"
    ){

      orbListening();

    }

  };


  /* ================= ON RESULT ================= */

  recognition.onresult =
    event => {

      const transcript =
        Array.from(
          event.results
        )
        .map(
          result =>
            result[0].transcript
        )
        .join(" ")
        .trim();


      console.log(
        "Speech:",
        transcript
      );


      if(
        recognitionState === "wake"
      ){

        handleWakeResult(
          transcript
        );

        return;

      }


      if(
        recognitionState === "command"
      ){

        /*
          Command مل گئی
        */

        recognitionState =
          "processing";


        if(
          recognition &&
          !manualStop
        ){

          try{
            recognition.stop();
          }catch(e){}

        }


        if(transcript){

          sendText(
            transcript
          );

        }else{

          processing = false;

          finishCommand();

        }

      }

    };


  /* ================= ON END ================= */

  recognition.onend = () => {

    console.log(
      "Recognition ended:",
      recognitionState
    );


    orbNormal();


    /*
      STOP button نے manually بند کیا ہے۔
      یہاں سے کچھ بھی restart نہیں ہوگا۔
    */

    if(manualStop){

      recognitionState =
        "idle";

      setStatus(
        "Voice بند ہے"
      );

      return;

    }


    /*
      Wake word detect ہو گیا تھا۔
      اب command سننی ہے۔
    */

    if(
      recognitionState ===
      "command-pending"
    ){

      scheduleCommand();

      return;

    }


    /*
      اگر wake mode خود ختم ہوا
      تو صرف اسی صورت میں دوبارہ wake کریں
      جب wake واقعی enabled ہو۔
    */

    if(
      recognitionState === "wake" &&
      wakeEnabled
    ){

      scheduleWake();

      return;

    }


    /*
      Command process ہو رہی ہے۔
      sendText() خود finishCommand کرے گا۔
    */

    if(
      recognitionState === "processing"
    ){

      return;

    }


    if(
      recognitionState === "command"
    ){

      /*
        No speech / unexpected end
      */

      if(wakeEnabled){

        scheduleWake();

      }else{

        recognitionState =
          "idle";

        setStatus(
          "تیار ہوں"
        );

      }

    }

  };


  /* ================= ON ERROR ================= */

  recognition.onerror =
    event => {

      console.log(
        "Recognition error:",
        event.error
      );


      orbNormal();


      /*
        Permission issue:
        بار بار restart نہیں کرنا
      */

      if(
        event.error ===
        "not-allowed"
      ){

        recognitionState =
          "idle";

        wakeEnabled =
          false;

        wakeSetting.checked =
          false;

        settings.wake =
          false;

        saveSettings();

        setStatus(
          "Microphone permission دیں"
        );

        updateWakeButton();

        return;

      }


      /*
        Browser busy / aborted / no-speech
        Wake mode میں صرف controlled restart
      */

      if(
        event.error === "aborted" ||
        event.error === "no-speech"
      ){

        if(
          wakeEnabled &&
          !manualStop &&
          recognitionState === "wake"
        ){

          scheduleWake();

        }

        return;

      }


      if(
        recognitionState === "command"
      ){

        if(wakeEnabled){

          scheduleWake();

        }else{

          recognitionState =
            "idle";

          setStatus(
            "تیار ہوں"
          );

        }

      }

    };

}


/* =========================================================
   WAKE WORD DETECTION
   ========================================================= */

function normalizeWakeText(text){

  return String(text)
    .toLowerCase()
    .replace(/[؟?!,.،۔]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function findWakeWord(text){

  const t =
    normalizeWakeText(text);


  const variants = [

    "kamran",

    "kamran a1",

    "kamraan",

    "camran",

    "camraan",

    "کامران",

    "کام رن",

    "کمران"

  ];


  for(
    const word of variants
  ){

    if(
      t.includes(
        word
      )
    ){

      return word;

    }

  }


  return null;

}


/* =========================================================
   HANDLE WAKE RESULT
   ========================================================= */

function handleWakeResult(transcript){

  const wakeWord =
    findWakeWord(
      transcript
    );


  if(!wakeWord){

    /*
      Wake mode میں کوئی دوسرا لفظ آیا۔
      کچھ نہیں کریں۔
    */

    return;

  }


  /*
    Wake detect ہوگیا۔
    اب موجودہ recognition کو stop کریں۔

    IMPORTANT:
    یہاں دوبارہ startWake() نہیں چلانا۔
    onend command-pending دیکھ کر
    command mode شروع کرے گا۔
  */

  const cleaned =
    transcript
      .replace(
        new RegExp(
          wakeWord,
          "i"
        ),
        ""
      )
      .trim();


  recognitionState =
    "command-pending";


  setStatus(
    "جی، بولیں..."
  );


  /*
    اگر Kamran کے ساتھ ہی command بھی بول دی گئی:
    
    مثال:
    "Kamran میرا نام کیا ہے"

    تو دوبارہ command سننے کی ضرورت نہیں۔
  */

  if(cleaned){

    recognitionState =
      "processing";


    try{

      recognition.stop();

    }catch(e){}


    setTimeout(() => {

      sendText(
        cleaned
      );

    },250);


    return;

  }


  try{

    recognition.stop();

  }catch(e){}

}


/* =========================================================
   SCHEDULE WAKE
   ========================================================= */

function scheduleWake(){

  if(
    !wakeEnabled ||
    manualStop ||
    !recognition
  ){

    return;

  }


  clearTimeout(
    restartTimer
  );


  /*
    پہلے state واضح کریں،
    پھر صرف ایک timer۔
  */

  recognitionState =
    "wake";


  restartTimer =
    setTimeout(() => {

      if(
        !wakeEnabled ||
        manualStop ||
        !recognition
      ){

        return;

      }


      try{

        recognition.start();

        setStatus(
          "Kamran بولیں..."
        );

      }catch(error){

        /*
          اگر browser پہلے سے running ہو
          تو دوبارہ start نہ کریں۔
        */

        console.log(
          "Wake start:",
          error
        );


        /*
          صرف ایک controlled retry
        */

        clearTimeout(
          restartTimer
        );


        restartTimer =
          setTimeout(() => {

            if(
              wakeEnabled &&
              !manualStop
            ){

              try{

                recognition.start();

              }catch(e){}

            }

          },1000);

      }

    },450);

}


/* =========================================================
   SCHEDULE COMMAND
   ========================================================= */

function scheduleCommand(){

  if(
    manualStop ||
    !recognition
  ){

    return;

  }


  clearTimeout(
    restartTimer
  );


  restartTimer =
    setTimeout(() => {

      if(
        manualStop ||
        !recognition
      ){

        return;

      }


      recognitionState =
        "command";


      setStatus(
        "سن رہا ہوں..."
      );


      try{

        recognition.start();

      }catch(error){

        console.log(
          "Command start:",
          error
        );


        setTimeout(() => {

          if(
            !manualStop
          ){

            try{

              recognition.start();

            }catch(e){}

          }

        },500);

      }

    },350);

}


/* =========================================================
   START MANUAL VOICE
   ========================================================= */

function startManualVoice(){

  if(!recognition){

    setStatus(
      "آپ کے browser میں Voice Recognition موجود نہیں۔"
    );

    return;

  }


  /*
    اگر پہلے wake چل رہا ہے تو اسے روک دیں،
    مگر wakeEnabled کو بند نہیں کریں۔
  */

  clearTimeout(
    restartTimer
  );


  manualStop =
    false;


  recognitionState =
    "command";


  setStatus(
    "سن رہا ہوں..."
  );


  try{

    recognition.stop();

  }catch(e){}


  setTimeout(() => {

    if(
      manualStop
    ){

      return;

    }


    try{

      recognition.start();

    }catch(error){

      console.log(
        "Manual voice:",
        error
      );

    }

  },250);

}


/* =========================================================
   WAKE BUTTON UI
   ========================================================= */

function updateWakeButton(){

  if(wakeEnabled){

    wakeBtn.classList.add(
      "active"
    );

    wakeBtn.textContent =
      "🟢 Wake ON";

  }else{

    wakeBtn.classList.remove(
      "active"
    );

    wakeBtn.textContent =
      "🟢 Kamran Wake";

  }

}


updateWakeButton();


/* =========================================================
   ENABLE WAKE
   ========================================================= */

function enableWake(){

  if(!recognition){

    setStatus(
      "آپ کے browser میں Voice Wake support نہیں ہے۔"
    );

    wakeEnabled =
      false;

    wakeSetting.checked =
      false;

    return;

  }


  /*
    پہلے پرانے timer کو ختم کریں
  */

  clearTimeout(
    restartTimer
  );


  /*
    Stop state ختم
  */

  manualStop =
    false;


  wakeEnabled =
    true;


  settings.wake =
    true;

  wakeSetting.checked =
    true;

  saveSettings();

  updateWakeButton();


  setStatus(
    "Kamran بولیں..."
  );


  /*
    صرف ایک جگہ سے wake start ہوگا
  */

  scheduleWake();

}


/* =========================================================
   DISABLE WAKE
   ========================================================= */

function disableWake(){

  wakeEnabled =
    false;


  settings.wake =
    false;

  wakeSetting.checked =
    false;

  saveSettings();


  clearTimeout(
    restartTimer
  );


  manualStop =
    true;


  recognitionState =
    "idle";


  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

  }


  updateWakeButton();

  orbNormal();

  setStatus(
    "Wake بند ہے"
  );

}


/* =========================================================
   STOP EVERYTHING
   ========================================================= */

function stopEverything(){

  /*
    سب سے پہلے manualStop true
    تاکہ onend دوبارہ کچھ start نہ کرے۔
  */

  manualStop =
    true;


  wakeEnabled =
    false;


  settings.wake =
    false;

  wakeSetting.checked =
    false;

  saveSettings();


  clearTimeout(
    restartTimer
  );


  recognitionState =
    "idle";


  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

  }


  stopSpeaking();


  processing =
    false;


  updateWakeButton();

  orbNormal();


  setStatus(
    "سب بند ہے"
  );

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

sendBtn.addEventListener(
  "click",
  () => {

    sendText(
      input.value
    );

  }
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendText(
        input.value
      );

    }

  }
);


voiceBtn.addEventListener(
  "click",
  () => {

    startManualVoice();

  }
);


wakeBtn.addEventListener(
  "click",
  () => {

    if(wakeEnabled){

      disableWake();

    }else{

      enableWake();

    }

  }
);


stopBtn.addEventListener(
  "click",
  () => {

    stopEverything();

  }
);


/* =========================================================
   SETTINGS EVENTS
   ========================================================= */

settingsBtn.addEventListener(
  "click",
  () => {

    settingsModal.classList.add(
      "show"
    );

  }
);


closeSettings.addEventListener(
  "click",
  () => {

    settingsModal.classList.remove(
      "show"
    );

  }
);


settingsModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      settingsModal
    ){

      settingsModal.classList.remove(
        "show"
      );

    }

  }
);


/* ================= VOICE SETTING ================= */

voiceSetting.addEventListener(
  "change",
  () => {

    settings.voice =
      voiceSetting.checked;

    saveSettings();


    if(
      !settings.voice
    ){

      stopSpeaking();

    }

  }
);


/* ================= WAKE SETTING ================= */

wakeSetting.addEventListener(
  "change",
  () => {

    if(
      wakeSetting.checked
    ){

      enableWake();

    }else{

      disableWake();

    }

  }
);


/* ================= MEMORY SETTING ================= */

memorySetting.addEventListener(
  "change",
  () => {

    settings.memory =
      memorySetting.checked;

    saveSettings();

  }
);


/* =========================================================
   CLEAR CHAT
   ========================================================= */

clearChat.addEventListener(
  "click",
  () => {

    history = [];

    localStorage.removeItem(
      HISTORY_KEY
    );

    chat.innerHTML = "";


    addMessage(
      "Chat صاف کر دی گئی ہے۔",
      "ai"
    );


    settingsModal.classList.remove(
      "show"
    );

  }
);


/* =========================================================
   CLEAR MEMORY
   ========================================================= */

clearMemory.addEventListener(
  "click",
  () => {

    memory = [];

    localStorage.removeItem(
      MEMORY_KEY
    );


    addMessage(
      "Local memory صاف کر دی گئی ہے۔",
      "ai"
    );


    settingsModal.classList.remove(
      "show"
    );

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

restoreHistory();


if(
  history.length === 0
){

  addMessage(
    "السلام علیکم کامران! میں Kamran A1 ہوں۔ آپ مجھ سے بات کر سکتے ہیں۔",
    "ai"
  );

}


if(!recognition){

  setStatus(
    "Voice Recognition اس browser میں available نہیں۔"
  );

}else{

  if(
    settings.wake
  ){

    /*
      Page load پر Wake automatically
      start نہیں کریں گے۔
      پہلے user کو Wake button دبانا ہوگا۔
      اس سے Android browser permission/state
      کے مسائل کم ہوتے ہیں۔
    */

    wakeEnabled =
      false;

    settings.wake =
      false;

    wakeSetting.checked =
      false;

    saveSettings();

  }

}


/* =========================================================
   DONE
   ========================================================= */

console.log(
  "Kamran A1 loaded successfully."
);

</script>
