<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kamran A1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
}

header{
  padding:18px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

#status{
  text-align:center;
  color:#8aa0b8;
  padding:8px;
  font-size:14px;
}

#wakeStatus{
  text-align:center;
  color:#22c55e;
  font-size:13px;
  padding-bottom:6px;
}

#chat{
  height:calc(100vh - 220px);
  overflow-y:auto;
  padding:15px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:15px;
  white-space:pre-wrap;
  line-height:1.6;
}

.user{
  background:#164e63;
  margin-right:auto;
}

.bot{
  background:#1e293b;
  margin-left:auto;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px;
  background:#0d111a;
  display:flex;
  gap:6px;
}

input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:12px;
  border:1px solid #334155;
  background:#111827;
  color:white;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 13px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

#mic{
  background:#16a34a;
}

#wakeBtn{
  background:#15803d;
}

#settings{
  position:fixed;
  top:65px;
  right:10px;
  left:10px;
  background:#111827;
  border:1px solid #334155;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:10;
}

#settings h3{
  margin-top:0;
}

#settings input{
  width:100%;
  margin-bottom:10px;
}

.smallBtn{
  margin-top:5px;
  background:#475569;
}
</style>
</head>

<body>

<header>

  Kamran A1 🤖

  <button
    onclick="toggleSettings()"
    style="float:left;background:#334155;padding:7px 10px;"
  >
    ⚙️
  </button>

</header>

<div id="status">
  تیار ہے
</div>

<div id="wakeStatus">
  Wake Mode بند ہے
</div>

<div id="chat"></div>

<div class="bottom">

  <input
    id="msg"
    placeholder="اپنا پیغام لکھیں..."
    autocomplete="off"
  >

  <button
    id="wakeBtn"
    onclick="toggleWakeMode()"
  >
    🟢 Wake
  </button>

  <button
    id="mic"
    onclick="startListening()"
  >
    🎙️
  </button>

  <button onclick="send()">
    ➤
  </button>

</div>

<div id="settings">

  <h3>⚙️ Kamran A1 Settings</h3>

  <label>Worker URL</label>

  <input
    id="workerUrl"
    placeholder="https://your-worker.workers.dev"
  >

  <button onclick="saveSettings()">
    💾 Save
  </button>

  <button
    class="smallBtn"
    onclick="clearMemory()"
  >
    🧠 Clear Memory
  </button>

  <button
    class="smallBtn"
    onclick="toggleSettings()"
  >
    بند کریں
  </button>

</div>


<script>

/* =========================
   BASIC VARIABLES
========================= */

const key = "kamran_a1_worker";

let mem =
  JSON.parse(
    localStorage.getItem("kamran_memory") || "[]"
  );

let history = [];

let recognition = null;

let listening = false;

let wakeRecognition = null;

let wakeMode = false;

let wakeListening = false;


const chat =
  document.getElementById("chat");

const msg =
  document.getElementById("msg");

const status =
  document.getElementById("status");

const wakeStatus =
  document.getElementById("wakeStatus");

const workerUrl =
  document.getElementById("workerUrl");


/* =========================
   SETTINGS
========================= */

workerUrl.value =
  localStorage.getItem(key) || "";


function toggleSettings(){

  const box =
    document.getElementById("settings");

  box.style.display =
    box.style.display === "block"
    ? "none"
    : "block";
}


function saveSettings(){

  let url =
    workerUrl.value.trim();

  url =
    url.replace(/\/$/,"");

  localStorage.setItem(
    key,
    url
  );

  status.textContent =
    "Worker URL محفوظ ہو گیا ✅";

  setTimeout(
    ()=>{
      status.textContent="تیار ہے";
    },
    1500
  );
}


/* =========================
   MEMORY
========================= */

function saveMemory(){

  localStorage.setItem(
    "kamran_memory",
    JSON.stringify(mem)
  );
}


function clearMemory(){

  mem=[];

  saveMemory();

  add(
    "Memory صاف کر دی گئی ہے۔ 🧠",
    "bot"
  );
}


/* =========================
   CHAT
========================= */

function add(text,type){

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   LOCAL COMMAND
========================= */

function localCommand(text){

  if(/میرا نام کیا ہے/.test(text)){

    const name =
      mem.find(
        x => x.type === "name"
      );

    return name
      ? "آپ کا نام " + name.value + " ہے۔"
      : "آپ کا نام ابھی Memory میں نہیں ہے۔";
  }


  let nameMatch =
    text.match(
      /^میرا نام(?: ہے)?\s+(.+)$/
    );

  if(nameMatch){

    const name =
      nameMatch[1].trim();

    mem =
      mem.filter(
        x => x.type !== "name"
      );

    mem.push({
      type:"name",
      value:name
    });

    saveMemory();

    return (
      "ٹھیک ہے، میں آپ کا نام یاد رکھوں گا: "
      + name
    );
  }


  if(
    text.startsWith("یاد رکھو")
  ){

    const value =
      text
      .replace(
        /^یاد رکھو[:：]?\s*/,
        ""
      )
      .trim();

    if(value){

      mem.push({
        type:"note",
        value:value
      });

      saveMemory();

      return (
        "ٹھیک ہے، یہ بات Memory میں محفوظ کر لی ہے۔"
      );
    }
  }


  return null;
}


/* =========================
   AI
========================= */

async function ask(text){

  let baseUrl =
    (
      localStorage.getItem(key) || ""
    ).replace(/\/$/,"");

  if(!baseUrl){

    return (
      "AI Brain ابھی connect نہیں ہوا۔ "
      + "⚙️ دبائیں اور Worker URL محفوظ کریں۔"
    );
  }


  const response =
    await fetch(
      baseUrl + "/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            message:text,

            memory:
              mem.slice(-12),

            history:
              history.slice(-20)

          })
      }
    );


  const data =
    await response
    .json()
    .catch(
      ()=>({})
    );


  if(!response.ok){

    throw new Error(
      data.error ||
      ("Server error " +
       response.status)
    );
  }


  return (
    data.reply ||
    "جواب نہیں ملا۔"
  );
}


/* =========================
   SEND
========================= */

async function send(){

  const text =
    msg.value.trim();

  if(!text)return;


  add(
    text,
    "user"
  );

  msg.value="";


  const local =
    localCommand(text);


  if(local){

    add(
      local,
      "bot"
    );

    speak(local);

    return;
  }


  status.textContent =
    "AI سوچ رہا ہے…";


  try{

    const reply =
      await ask(text);


    history.push({
      role:"user",
      content:text
    });


    history.push({
      role:"assistant",
      content:reply
    });


    add(
      reply,
      "bot"
    );


    speak(reply);


    status.textContent =
      "تیار ہے";


  }catch(error){

    add(
      "AI سے رابطہ نہیں ہو سکا۔ ⚠️\n"
      + error.message,
      "bot"
    );


    status.textContent =
      "Connection check کریں";
  }
}


/* =========================
   ENTER
========================= */

msg.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      send();
    }

  }
);


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  speechSynthesis.cancel();


  const utter =
    new SpeechSynthesisUtterance(
      text
    );


  utter.lang =
    "ur-PK";

  utter.rate =
    0.95;

  utter.pitch =
    1;


  speechSynthesis.speak(
    utter
  );
}


/* =========================
   NORMAL VOICE INPUT
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "ur-PK";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onstart =
    function(){

      listening=true;

      status.textContent =
        "🎙️ سن رہا ہوں…";

      document
        .getElementById("mic")
        .textContent =
        "🔴";
    };


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0]
        .transcript
        .trim();


      msg.value =
        text;


      send();
    };


  recognition.onerror =
    function(event){

      console.log(
        "Voice error:",
        event.error
      );

      listening=false;

      document
        .getElementById("mic")
        .textContent =
        "🎙️";

      status.textContent =
        "Voice error";
    };


  recognition.onend =
    function(){

      listening=false;

      document
        .getElementById("mic")
        .textContent =
        "🎙️";

      if(!wakeMode){

        status.textContent =
          "تیار ہے";
      }
    };
}


function startListening(){

  if(!recognition){

    alert(
      "آپ کے browser میں Voice Recognition support نہیں ہے۔"
    );

    return;
  }


  if(listening){

    recognition.stop();

    return;
  }


  try{

    recognition.start();

  }catch(error){

    console.log(error);
  }
}


/* =========================
   WAKE WORD
========================= */

function createWakeRecognition(){

  if(!SpeechRecognition){
    return null;
  }


  const r =
    new SpeechRecognition();


  r.lang =
    "ur-PK";


  r.continuous =
    true;


  r.interimResults =
    false;


  r.onstart =
    function(){

      wakeListening=true;

      wakeStatus.textContent =
        '🟢 Wake Mode ON — "Kamran" کہیں';
    };


  r.onresult =
    function(event){

      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        if(
          !event.results[i].isFinal
        ){
          continue;
        }


        const heard =
          event.results[i][0]
          .transcript
          .trim()
          .toLowerCase();


        console.log(
          "Wake heard:",
          heard
        );


        if(
          heard.includes("کامران") ||
          heard.includes("kamran")
        ){

          wakeStatus.textContent =
            "👂 جی کامران، میں سن رہا ہوں…";


          r.stop();


          speak(
            "جی، میں سن رہا ہوں۔"
          );


          setTimeout(
            function(){

              startListening();

            },
            1000
          );


          return;
        }
      }
    };


  r.onerror =
    function(event){

      console.log(
        "Wake error:",
        event.error
      );
    };


  r.onend =
    function(){

      wakeListening=false;


      if(wakeMode){

        setTimeout(
          function(){

            startWakeRecognition();

          },
          800
        );
      }
    };


  return r;
}


function startWakeRecognition(){

  if(!wakeMode){
    return;
  }


  if(wakeListening){
    return;
  }


  wakeRecognition =
    createWakeRecognition();


  if(!wakeRecognition){
    return;
  }


  try{

    wakeRecognition.start();

  }catch(error){

    console.log(
      "Wake start:",
      error
    );
  }
}


/* =========================
   WAKE MODE ON/OFF
========================= */

function toggleWakeMode(){

  if(!SpeechRecognition){

    alert(
      "آپ کے browser میں Voice Recognition support نہیں ہے۔"
    );

    return;
  }


  if(wakeMode){

    wakeMode=false;


    if(wakeRecognition){

      try{
        wakeRecognition.stop();
      }catch(e){}
    }


    wakeStatus.textContent =
      "Wake Mode بند ہے";


    document
      .getElementById("wakeBtn")
      .textContent =
      "🟢 Wake";


    status.textContent =
      "تیار ہے";


    return;
  }


  wakeMode=true;


  document
    .getElementById("wakeBtn")
    .textContent =
    "🔴 Stop";


  wakeStatus.textContent =
    '🟡 Microphone activate ہو رہا ہے…';


  startWakeRecognition();
}


/* =========================
   PAGE START
========================= */

status.textContent =
  "تیار ہے";

</script>

</body>
</html>
