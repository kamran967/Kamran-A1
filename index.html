<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kamran A1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
}

header{
  padding:18px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

#status{
  text-align:center;
  color:#8aa0b8;
  padding:8px;
  font-size:14px;
}

#wakeStatus{
  text-align:center;
  color:#22c55e;
  font-size:13px;
  padding-bottom:6px;
}

#chat{
  height:calc(100vh - 220px);
  overflow-y:auto;
  padding:15px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:15px;
  white-space:pre-wrap;
  line-height:1.6;
}

.user{
  background:#164e63;
  margin-right:auto;
}

.bot{
  background:#1e293b;
  margin-left:auto;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px;
  background:#0d111a;
  display:flex;
  gap:6px;
}

input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:12px;
  border:1px solid #334155;
  background:#111827;
  color:white;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 13px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#mic{
  background:#16a34a;
}

#wakeBtn{
  background:#15803d;
}

#settings{
  position:fixed;
  top:65px;
  right:10px;
  left:10px;
  background:#111827;
  border:1px solid #334155;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:100;
}

#settings h3{
  margin-top:0;
}

#settings input{
  width:100%;
  margin-bottom:10px;
}

.smallBtn{
  margin-top:5px;
  background:#475569;
}
</style>
</head>

<body>

<header>
  Kamran A1 🤖

  <button
    onclick="toggleSettings()"
    style="float:left;background:#334155;padding:7px 10px;"
  >
    ⚙️
  </button>
</header>

<div id="status">
  تیار ہے
</div>

<div id="wakeStatus">
  Wake Mode بند ہے
</div>

<div id="chat"></div>

<div class="bottom">

  <input
    id="msg"
    placeholder="اپنا پیغام لکھیں..."
    autocomplete="off"
  >

  <button
    id="wakeBtn"
    onclick="toggleWakeMode()"
  >
    🟢 Wake
  </button>

  <button
    id="mic"
    onclick="startListening()"
  >
    🎙️
  </button>

  <button onclick="send()">
    ➤
  </button>

</div>

<div id="settings">

  <h3>⚙️ Kamran A1 Settings</h3>

  <label>Worker URL</label>

  <input
    id="workerUrl"
    placeholder="https://your-worker.workers.dev"
  >

  <button onclick="saveSettings()">
    💾 Save
  </button>

  <button
    class="smallBtn"
    onclick="clearMemory()"
  >
    🧠 Clear Memory
  </button>

  <button
    class="smallBtn"
    onclick="toggleSettings()"
  >
    بند کریں
  </button>

</div>


<script>

/* =====================================================
   BASIC VARIABLES
===================================================== */

const key = "kamran_a1_worker";
const memoryKey = "kamran_memory";

let mem = [];

try{
  mem = JSON.parse(
    localStorage.getItem(memoryKey) || "[]"
  );

  if(!Array.isArray(mem)){
    mem = [];
  }
}catch(e){
  mem = [];
}

let history = [];

let recognition = null;
let wakeRecognition = null;

let listening = false;
let wakeListening = false;

let wakeMode = false;

let voiceState = "idle";

let wakeRestartTimer = null;
let commandRestartTimer = null;

let processing = false;


const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
const status = document.getElementById("status");
const wakeStatus = document.getElementById("wakeStatus");
const workerUrl = document.getElementById("workerUrl");
const micButton = document.getElementById("mic");
const wakeButton = document.getElementById("wakeBtn");


/* =====================================================
   SETTINGS
===================================================== */

workerUrl.value =
  localStorage.getItem(key) || "";


function toggleSettings(){

  const box =
    document.getElementById("settings");

  box.style.display =
    box.style.display === "block"
      ? "none"
      : "block";
}


function saveSettings(){

  let url =
    workerUrl.value.trim();

  url =
    url.replace(/\/+$/,"");

  if(!url){

    status.textContent =
      "Worker URL خالی ہے۔";

    return;
  }

  localStorage.setItem(
    key,
    url
  );

  status.textContent =
    "Worker URL محفوظ ہو گیا ✅";

  setTimeout(function(){

    if(!processing){
      status.textContent =
        "تیار ہے";
    }

  },1500);
}


/* =====================================================
   MEMORY
===================================================== */

function saveMemory(){

  try{

    localStorage.setItem(
      memoryKey,
      JSON.stringify(mem)
    );

  }catch(error){

    console.log(
      "Memory save error:",
      error
    );
  }
}


function clearMemory(){

  mem = [];

  saveMemory();

  add(
    "Memory صاف کر دی گئی ہے۔ 🧠",
    "bot"
  );

  speak(
    "Memory صاف کر دی گئی ہے۔"
  );
}


/* =====================================================
   CHAT
===================================================== */

function add(text,type){

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.textContent =
    String(text || "");

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =====================================================
   TEXT CLEANER
===================================================== */

function cleanText(text){

  return String(text || "")
    .trim()
    .replace(/[۔؟?.,،!！]/g,"")
    .replace(/\s+/g," ");
}


/* =====================================================
   LOCAL COMMANDS / MEMORY
===================================================== */

function localCommand(originalText){

  const text =
    cleanText(originalText);

  const lower =
    text.toLowerCase();


  /* =================================================
     ASK NAME - URDU
  ================================================= */

  if(
    text.includes("میرا نام") &&
    (
      text.includes("کیا ہے") ||
      text.includes("کون ہے") ||
      text.includes("بتاؤ") ||
      text.includes("بتاو") ||
      text.includes("یاد ہے")
    )
  ){

    const savedName =
      mem.find(
        x => x &&
        x.type === "name"
      );

    if(
      savedName &&
      savedName.value
    ){

      return {
        reply:
          "آپ کا نام " +
          savedName.value +
          " ہے۔",
        handled:true
      };
    }

    return {
      reply:
        "آپ کا نام ابھی Memory میں محفوظ نہیں ہے۔",
      handled:true
    };
  }


  /* =================================================
     ASK NAME - ENGLISH
  ================================================= */

  if(
    lower === "what is my name" ||
    lower === "whats my name" ||
    lower === "do you know my name"
  ){

    const savedName =
      mem.find(
        x => x &&
        x.type === "name"
      );

    if(
      savedName &&
      savedName.value
    ){

      return {
        reply:
          "Your name is " +
          savedName.value +
          ".",
        handled:true
      };
    }

    return {
      reply:
        "I don't have your name saved yet.",
      handled:true
    };
  }


  /* =================================================
     SAVE NAME - URDU
  ================================================= */

  if(
    text.startsWith("میرا نام ")
  ){

    let name = "";

    let match =
      text.match(
        /^میرا نام\s+(.+?)\s+ہے$/i
      );

    if(match){

      name =
        match[1].trim();
    }

    if(!name){

      match =
        text.match(
          /^میرا نام\s+(.+)$/i
        );

      if(match){

        name =
          match[1].trim();
      }
    }


    name =
      name
        .replace(
          /^(سیو کرلو|save کرلو|یاد رکھو|یاد کرلو)\s*/i,
          ""
        )
        .trim();


    name =
      name
        .replace(/\s+ہے$/i,"")
        .trim();


    if(
      name &&
      name !== "کیا ہے" &&
      name !== "کون ہے" &&
      name !== "بتاؤ" &&
      name !== "بتاو"
    ){

      mem =
        mem.filter(
          x => x.type !== "name"
        );

      mem.push({
        type:"name",
        value:name
      });

      saveMemory();

      return {
        reply:
          "ٹھیک ہے، میں آپ کا نام یاد رکھوں گا: " +
          name,
        handled:true
      };
    }
  }


  /* =================================================
     SAVE NAME - ENGLISH
  ================================================= */

  const englishName =
    lower.match(
      /^my name is\s+(.+)$/i
    );

  if(englishName){

    const name =
      englishName[1].trim();

    if(name){

      mem =
        mem.filter(
          x => x.type !== "name"
        );

      mem.push({
        type:"name",
        value:name
      });

      saveMemory();

      return {
        reply:
          "Okay, I will remember your name: " +
          name,
        handled:true
      };
    }
  }


  /* =================================================
     GENERAL MEMORY
  ================================================= */

  if(
    text.startsWith("یاد رکھو")
  ){

    const value =
      text
        .replace(
          /^یاد رکھو[:：]?\s*/,""
        )
        .trim();

    if(value){

      mem.push({
        type:"note",
        value:value
      });

      saveMemory();

      return {
        reply:
          "ٹھیک ہے، یہ بات Memory میں محفوظ کر لی ہے۔",
        handled:true
      };
    }
  }


  return {
    handled:false
  };
}


/* =====================================================
   AI WORKER
===================================================== */

async function ask(text){

  const baseUrl =
    (
      localStorage.getItem(key) || ""
    ).replace(/\/+$/,"");


  if(!baseUrl){

    throw new Error(
      "Worker URL محفوظ نہیں ہے۔ Settings میں Worker URL ڈالیں۔"
    );
  }


  const response =
    await fetch(
      baseUrl + "/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            message:text,

            memory:
              mem.slice(-12),

            history:
              history.slice(-20)

          })
      }
    );


  const data =
    await response
      .json()
      .catch(
        ()=>({})
      );


  if(!response.ok){

    throw new Error(
      data.error ||
      ("Server error " +
       response.status)
    );
  }


  if(!data.reply){

    throw new Error(
      "Worker نے جواب نہیں دیا۔"
    );
  }


  return String(data.reply);
}


/* =====================================================
   SPEAK
===================================================== */

function speak(text,done){

  const speechText =
    String(text || "").trim();


  if(!speechText){

    if(done){
      done();
    }

    return;
  }


  if(
    !("speechSynthesis" in window)
  ){

    if(done){
      done();
    }

    return;
  }


  try{
    speechSynthesis.cancel();
  }catch(e){}


  voiceState =
    "speaking";


  status.textContent =
    "🔊 بول رہا ہوں…";


  const utter =
    new SpeechSynthesisUtterance(
      speechText
    );


  utter.lang =
    "ur-PK";

  utter.rate =
    0.95;

  utter.pitch =
    1;


  let finished = false;


  function finishSpeech(){

    if(finished){
      return;
    }

    finished = true;

    voiceState =
      "idle";

    if(done){

      setTimeout(
        done,
        250
      );

    }else{

      afterSpeech();
    }
  }


  utter.onstart =
    function(){

      voiceState =
        "speaking";

      status.textContent =
        "🔊 بول رہا ہوں…";
    };


  utter.onend =
    function(){

      finishSpeech();
    };


  utter.onerror =
    function(event){

      console.log(
        "Speech error:",
        event
      );

      finishSpeech();
    };


  speechSynthesis.speak(
    utter
  );
}


/* =====================================================
   AFTER SPEECH
===================================================== */

function afterSpeech(){

  if(!wakeMode){

    voiceState =
      "idle";

    processing =
      false;

    status.textContent =
      "تیار ہے";

    return;
  }


  if(
    voiceState === "command" ||
    voiceState === "processing"
  ){

    return;
  }


  voiceState =
    "wake";

  processing =
    false;


  status.textContent =
    "تیار ہے";


  wakeStatus.textContent =
    '🟢 Wake Mode ON — "Kamran" کہیں';


  scheduleWakeRestart(350);
}


/* =====================================================
   SEND
===================================================== */

async function send(){

  const text =
    msg.value.trim();


  if(!text){
    return;
  }


  if(processing){
    return;
  }


  processing =
    true;


  if(wakeMode){

    voiceState =
      "processing";
  }


  add(
    text,
    "user"
  );


  msg.value =
    "";


  const local =
    localCommand(text);


  if(
    local &&
    local.handled
  ){

    add(
      local.reply,
      "bot"
    );


    speak(
      local.reply,
      function(){

        processing =
          false;

        if(wakeMode){

          voiceState =
            "wake";

          afterSpeech();

        }else{

          voiceState =
            "idle";

          status.textContent =
            "تیار ہے";
        }

      }
    );

    return;
  }


  status.textContent =
    "AI سوچ رہا ہے…";


  try{

    const reply =
      await ask(text);


    history.push({
      role:"user",
      content:text
    });


    history.push({
      role:"assistant",
      content:reply
    });


    history =
      history.slice(-20);


    add(
      reply,
      "bot"
    );


    speak(
      reply,
      function(){

        processing =
          false;

        if(wakeMode){

          voiceState =
            "wake";

          afterSpeech();

        }else{

          voiceState =
            "idle";

          status.textContent =
            "تیار ہے";
        }

      }
    );


  }catch(error){

    console.log(
      "AI error:",
      error
    );


    add(
      "AI سے رابطہ نہیں ہو سکا۔ ⚠️\n" +
      error.message,
      "bot"
    );


    processing =
      false;

    voiceState =
      "idle";


    status.textContent =
      "Connection check کریں";


    if(wakeMode){

      voiceState =
        "wake";

      scheduleWakeRestart(700);
    }
  }
}


/* =====================================================
   ENTER KEY
===================================================== */

msg.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      send();
    }

  }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* =====================================================
   NORMAL COMMAND RECOGNITION
===================================================== */

function createCommandRecognition(){

  if(!SpeechRecognition){
    return null;
  }


  const r =
    new SpeechRecognition();


  /*
     Urdu recognition سے "کامران"
     عام طور پر اردو میں حاصل ہوگا۔
  */

  r.lang =
    "ur-PK";

  r.continuous =
    false;

  r.interimResults =
    false;

  r.maxAlternatives =
    3;


  r.onstart =
    function(){

      listening =
        true;

      voiceState =
        "command";


      status.textContent =
        "🎙️ سن رہا ہوں…";


      micButton.textContent =
        "🔴";
    };


  r.onresult =
    function(event){

      let text = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        if(
          event.results[i].isFinal
        ){

          text +=
            " " +
            event.results[i][0]
              .transcript;
        }
      }


      text =
        text.trim();


      console.log(
        "COMMAND:",
        text
      );


      if(!text){

        voiceState =
          wakeMode
            ? "wake"
            : "idle";

        return;
      }


      voiceState =
        "processing";


      msg.value =
        text;


      send();
    };


  r.onerror =
    function(event){

      console.log(
        "Command recognition error:",
        event.error
      );


      listening =
        false;


      micButton.textContent =
        "🎙️";


      if(
        event.error === "aborted" ||
        event.error === "no-speech"
      ){

        if(wakeMode){

          voiceState =
            "wake";

          status.textContent =
            "تیار ہے";

          scheduleWakeRestart(400);

        }else{

          voiceState =
            "idle";

          status.textContent =
            "تیار ہے";
        }

        return;
      }


      voiceState =
        "idle";


      status.textContent =
        "Voice دوبارہ try کریں۔";
    };


  r.onend =
    function(){

      listening =
        false;


      micButton.textContent =
        "🎙️";


      if(
        voiceState === "processing" ||
        voiceState === "speaking"
      ){

        return;
      }


      if(wakeMode){

        voiceState =
          "wake";

        scheduleWakeRestart(400);

      }else{

        voiceState =
          "idle";

        status.textContent =
          "تیار ہے";
      }
    };


  return r;
}


if(SpeechRecognition){

  recognition =
    createCommandRecognition();
}


/* =====================================================
   MANUAL LISTENING
===================================================== */

function startListening(){

  if(!recognition){

    alert(
      "آپ کے browser میں Voice Recognition support نہیں ہے۔"
    );

    return;
  }


  if(processing){

    return;
  }


  if(listening){

    try{

      recognition.stop();

    }catch(e){}

    return;
  }


  clearWakeRestart();


  if(
    wakeRecognition &&
    wakeListening
  ){

    try{

      wakeRecognition.stop();

    }catch(e){}

    wakeListening =
      false;
  }


  if(
    voiceState === "speaking"
  ){

    return;
  }


  try{

    speechSynthesis.cancel();

  }catch(e){}


  voiceState =
    "command";


  status.textContent =
    "🎙️ سن رہا ہوں…";


  try{

    recognition.start();

  }catch(error){

    console.log(
      "Manual recognition start:",
      error
    );

    /*
       اگر recognition پہلے ہی چل رہا ہو
       تو InvalidStateError آ سکتا ہے۔
    */

    setTimeout(function(){

      try{

        if(
          !listening &&
          !processing
        ){

          recognition.start();
        }

      }catch(e){

        console.log(
          "Retry recognition:",
          e
        );
      }

    },500);
  }
}


/* =====================================================
   WAKE WORD NORMALIZER
===================================================== */

function normalizeWakeText(text){

  return String(text || "")
    .toLowerCase()
    .replace(/[.,!?،۔؟]/g," ")
    .replace(/\s+/g," ")
    .trim();
}


/* =====================================================
   KAMRAN DETECTION
===================================================== */

function isKamran(text){

  const t =
    normalizeWakeText(text);


  if(!t){
    return false;
  }


  const patterns = [

    /* Urdu */

    "کامران",
    "کمران",
    "کام ر ان",
    "کامر ان",
    "کام ران",

    /* English */

    "kamran",
    "kam ran",
    "kamron",
    "kam ron",
    "camran",
    "cam ran",
    "camron",
    "cam ron"
  ];


  for(
    const pattern of patterns
  ){

    if(
      t.includes(pattern)
    ){

      return true;
    }
  }


  /*
     کچھ موبائل recognition engines
     "کامران" کو الگ الفاظ میں بھی دیتے ہیں۔
  */

  const compact =
    t.replace(/\s+/g,"");


  if(
    compact.includes("کامران") ||
    compact.includes("کمران")
  ){

    return true;
  }


  return false;
}


/* =====================================================
   STOP WAKE RECOGNITION
===================================================== */

function stopWakeRecognition(){

  if(wakeRecognition){

    try{

      wakeRecognition.onend =
        null;

      wakeRecognition.onerror =
        null;

      wakeRecognition.stop();

    }catch(e){}

  }

  wakeRecognition =
    null;

  wakeListening =
    false;
}


/* =====================================================
   WAKE RESTART TIMER
===================================================== */

function clearWakeRestart(){

  if(wakeRestartTimer){

    clearTimeout(
      wakeRestartTimer
    );

    wakeRestartTimer =
      null;
  }
}


function scheduleWakeRestart(delay){

  clearWakeRestart();


  if(!wakeMode){
    return;
  }


  wakeRestartTimer =
    setTimeout(function(){

      wakeRestartTimer =
        null;

      if(
        !wakeMode ||
        wakeListening ||
        listening ||
        processing ||
        voiceState === "speaking"
      ){

        return;
      }


      voiceState =
        "wake";


      startWakeRecognition();

    },delay);
}


/* =====================================================
   CREATE WAKE RECOGNITION
===================================================== */

function createWakeRecognition(){

  if(!SpeechRecognition){

    return null;
  }


  const r =
    new SpeechRecognition();


  /*
     Wake word کے لیے Urdu بہتر ہے کیونکہ
     user "کامران" اردو میں بھی کہتا ہے۔
  */

  r.lang =
    "ur-PK";

  r.continuous =
    true;

  r.interimResults =
    true;

  r.maxAlternatives =
    3;


  r.onstart =
    function(){

      wakeListening =
        true;

      voiceState =
        "wake";


      wakeStatus.textContent =
        '🟢 Wake Mode ON — "Kamran" کہیں';

      status.textContent =
        "👂 سن رہا ہوں…";
    };


  r.onresult =
    function(event){

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        const result =
          event.results[i];


        let heard =
          "";


        for(
          let j = 0;
          j < result.length;
          j++
        ){

          heard +=
            " " +
            result[j].transcript;
        }


        heard =
          heard.trim();


        if(!heard){
          continue;
        }


        console.log(
          "WAKE:",
          heard
        );


        if(
          isKamran(heard)
        ){

          console.log(
            "KAMRAN DETECTED:",
            heard
          );


          handleWakeDetected();

          return;
        }
      }
    };


  r.onerror =
    function(event){

      console.log(
        "WAKE ERROR:",
        event.error
      );


      wakeListening =
        false;


      if(
        event.error === "aborted" ||
        event.error === "no-speech"
      ){

        if(
          wakeMode &&
          voiceState === "wake"
        ){

          scheduleWakeRestart(500);
        }

        return;
      }


      if(
        wakeMode &&
        voiceState === "wake"
      ){

        scheduleWakeRestart(1200);
      }
    };


  r.onend =
    function(){

      wakeListening =
        false;


      if(!wakeMode){
        return;
      }


      if(
        voiceState === "speaking" ||
        voiceState === "command" ||
        voiceState === "processing"
      ){

        return;
      }


      if(
        voiceState === "wake"
      ){

        scheduleWakeRestart(500);
      }
    };


  return r;
}


/* =====================================================
   WAKE DETECTED
===================================================== */

function handleWakeDetected(){

  if(!wakeMode){
    return;
  }


  if(
    voiceState === "speaking" ||
    voiceState === "command" ||
    voiceState === "processing"
  ){

    return;
  }


  clearWakeRestart();


  stopWakeRecognition();


  voiceState =
    "speaking";


  wakeStatus.textContent =
    "👂 جی کامران، میں سن رہا ہوں…";


  status.textContent =
    "🔊 جواب دے رہا ہوں…";


  speak(
    "جی کامران، میں سن رہا ہوں۔",
    function(){

      if(!wakeMode){

        voiceState =
          "idle";

        status.textContent =
          "تیار ہے";

        return;
      }


      /*
         Wake word کے بعد اب اصل command
         سننے کے لیے normal recognition شروع ہوگا۔
      */

      voiceState =
        "command";


      wakeStatus.textContent =
        "🟡 جی، بولیں…";


      status.textContent =
        "🎙️ سن رہا ہوں…";


      setTimeout(function(){

        if(
          wakeMode &&
          !listening &&
          !processing
        ){

          startListening();
        }

      },350);

    }
  );
}


/* =====================================================
   START WAKE RECOGNITION
===================================================== */

function startWakeRecognition(){

  if(!wakeMode){
    return;
  }


  if(
    wakeListening ||
    listening ||
    processing
  ){

    return;
  }


  if(
    voiceState !== "wake"
  ){

    return;
  }


  if(
    "speechSynthesis" in window &&
    speechSynthesis.speaking
  ){

    scheduleWakeRestart(500);

    return;
  }


  stopWakeRecognition();


  wakeRecognition =
    createWakeRecognition();


  if(!wakeRecognition){

    wakeStatus.textContent =
      "Voice Recognition دستیاب نہیں ہے۔";

    return;
  }


  try{

    wakeRecognition.start();

  }catch(error){

    console.log(
      "Wake start error:",
      error
    );


    wakeListening =
      false;


    scheduleWakeRestart(800);
  }
}


/* =====================================================
   TOGGLE WAKE MODE
===================================================== */

function toggleWakeMode(){

  if(!SpeechRecognition){

    alert(
      "آپ کے browser میں Voice Recognition support نہیں ہے۔"
    );

    return;
  }


  /* =================================================
     OFF
  ================================================= */

  if(wakeMode){

    wakeMode =
      false;


    clearWakeRestart();


    stopWakeRecognition();


    if(
      recognition &&
      listening
    ){

      try{

        recognition.stop();

      }catch(e){}
    }


    listening =
      false;


    processing =
      false;


    voiceState =
      "idle";


    try{

      speechSynthesis.cancel();

    }catch(e){}


    wakeStatus.textContent =
      "Wake Mode بند ہے";


    wakeButton.textContent =
      "🟢 Wake";


    micButton.textContent =
      "🎙️";


    status.textContent =
      "تیار ہے";


    return;
  }


  /* =================================================
     ON
  ================================================= */

  wakeMode =
    true;

  processing =
    false;

  voiceState =
    "wake";


  wakeButton.textContent =
    "🔴 Stop";


  wakeStatus.textContent =
    '🟡 Microphone activate ہو رہا ہے…';


  status.textContent =
    "Wake Mode شروع ہو رہا ہے…";


  if(
    recognition &&
    listening
  ){

    try{

      recognition.stop();

    }catch(e){}

    listening =
      false;
  }


  if(
    "speechSynthesis" in window &&
    speechSynthesis.speaking
  ){

    const wait =
      setInterval(function(){

        if(
          !speechSynthesis.speaking
        ){

          clearInterval(wait);

          if(wakeMode){

            voiceState =
              "wake";

            startWakeRecognition();
          }

        }

      },100);

    return;
  }


  setTimeout(function(){

    if(wakeMode){

      voiceState =
        "wake";

      startWakeRecognition();
    }

  },300);
}

   PAGE START
===================================================== */

status.textContent =
  "تیار ہے";


/*
   Browser page load پر microphone خود start
   نہیں کریں گے۔ Wake button دبانے کے بعد
   microphone activate ہوگا۔
*/

console.log(
  "Kamran A1 loaded successfully."
);
