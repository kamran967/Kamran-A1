<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kamran A1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
}

header{
  padding:18px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

#status{
  text-align:center;
  color:#8aa0b8;
  padding:8px;
  font-size:14px;
}

#wakeStatus{
  text-align:center;
  color:#22c55e;
  font-size:13px;
  padding-bottom:6px;
}

#chat{
  height:calc(100vh - 220px);
  overflow-y:auto;
  padding:15px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:15px;
  white-space:pre-wrap;
  line-height:1.6;
}

.user{
  background:#164e63;
  margin-right:auto;
}

.bot{
  background:#1e293b;
  margin-left:auto;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px;
  background:#0d111a;
  display:flex;
  gap:6px;
}

input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:12px;
  border:1px solid #334155;
  background:#111827;
  color:white;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 13px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

#mic{
  background:#16a34a;
}

#wakeBtn{
  background:#15803d;
}

#settings{
  position:fixed;
  top:65px;
  right:10px;
  left:10px;
  background:#111827;
  border:1px solid #334155;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:10;
}

#settings h3{
  margin-top:0;
}

#settings input{
  width:100%;
  margin-bottom:10px;
}

.smallBtn{
  margin-top:5px;
  background:#475569;
}
</style>
</head>

<body>

<header>

  Kamran A1 🤖

  <button
    onclick="toggleSettings()"
    style="float:left;background:#334155;padding:7px 10px;"
  >
    ⚙️
  </button>

</header>

<div id="status">
  تیار ہے
</div>

<div id="wakeStatus">
  Wake Mode بند ہے
</div>

<div id="chat"></div>

<div class="bottom">

  <input
    id="msg"
    placeholder="اپنا پیغام لکھیں..."
    autocomplete="off"
  >

  <button
    id="wakeBtn"
    onclick="toggleWakeMode()"
  >
    🟢 Wake
  </button>

  <button
    id="mic"
    onclick="startListening()"
  >
    🎙️
  </button>

  <button onclick="send()">
    ➤
  </button>

</div>

<div id="settings">

  <h3>⚙️ Kamran A1 Settings</h3>

  <label>Worker URL</label>

  <input
    id="workerUrl"
    placeholder="https://your-worker.workers.dev"
  >

  <button onclick="saveSettings()">
    💾 Save
  </button>

  <button
    class="smallBtn"
    onclick="clearMemory()"
  >
    🧠 Clear Memory
  </button>

  <button
    class="smallBtn"
    onclick="toggleSettings()"
  >
    بند کریں
  </button>

</div>


<script>

/* =========================
   BASIC VARIABLES
========================= */

const key = "kamran_a1_worker";

let mem =
  JSON.parse(
    localStorage.getItem("kamran_memory") || "[]"
  );

let history = [];

let recognition = null;

let listening = false;

let wakeRecognition = null;

let wakeMode = false;

let wakeListening = false;

/*
   یہ flag بتائے گا کہ Wake Word کے بعد
   ہم command سننے کے مرحلے میں ہیں۔
*/
let waitingForCommand = false;

/*
   یہ flag بتائے گا کہ Assistant اس وقت بول رہا ہے۔
*/
let assistantSpeaking = false;


const chat =
  document.getElementById("chat");

const msg =
  document.getElementById("msg");

const status =
  document.getElementById("status");

const wakeStatus =
  document.getElementById("wakeStatus");

const workerUrl =
  document.getElementById("workerUrl");


/* =========================
   SETTINGS
========================= */

workerUrl.value =
  localStorage.getItem(key) || "";


function toggleSettings(){

  const box =
    document.getElementById("settings");

  box.style.display =
    box.style.display === "block"
    ? "none"
    : "block";
}


function saveSettings(){

  let url =
    workerUrl.value.trim();

  url =
    url.replace(/\/$/,"");

  localStorage.setItem(
    key,
    url
  );

  status.textContent =
    "Worker URL محفوظ ہو گیا ✅";

  setTimeout(
    ()=>{
      if(!assistantSpeaking){
        status.textContent="تیار ہے";
      }
    },
    1500
  );
}


/* =========================
   MEMORY
========================= */

function saveMemory(){

  localStorage.setItem(
    "kamran_memory",
    JSON.stringify(mem)
  );
}


function clearMemory(){

  mem=[];

  saveMemory();

  add(
    "Memory صاف کر دی گئی ہے۔ 🧠",
    "bot"
  );
}


/* =========================
   CHAT
========================= */

function add(text,type){

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   LOCAL COMMAND
========================= */

function localCommand(text){

  if(/میرا نام کیا ہے/.test(text)){

    const name =
      mem.find(
        x => x.type === "name"
      );

    return name
      ? "آپ کا نام " + name.value + " ہے۔"
      : "آپ کا نام ابھی Memory میں نہیں ہے۔";
  }


  let nameMatch =
    text.match(
      /^میرا نام(?: ہے)?\s+(.+)$/
    );

  if(nameMatch){

    const name =
      nameMatch[1].trim();

    mem =
      mem.filter(
        x => x.type !== "name"
      );

    mem.push({
      type:"name",
      value:name
    });

    saveMemory();

    return (
      "ٹھیک ہے، میں آپ کا نام یاد رکھوں گا: "
      + name
    );
  }


  if(
    text.startsWith("یاد رکھو")
  ){

    const value =
      text
      .replace(
        /^یاد رکھو[:：]?\s*/,
        ""
      )
      .trim();

    if(value){

      mem.push({
        type:"note",
        value:value
      });

      saveMemory();

      return (
        "ٹھیک ہے، یہ بات Memory میں محفوظ کر لی ہے۔"
      );
    }
  }


  return null;
}


/* =========================
   AI
========================= */

async function ask(text){

  let baseUrl =
    (
      localStorage.getItem(key) || ""
    ).replace(/\/$/,"");

  if(!baseUrl){

    return (
      "AI Brain ابھی connect نہیں ہوا۔ "
      + "⚙️ دبائیں اور Worker URL محفوظ کریں۔"
    );
  }


  const response =
    await fetch(
      baseUrl + "/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            message:text,

            memory:
              mem.slice(-12),

            history:
              history.slice(-20)

          })
      }
    );


  const data =
    await response
    .json()
    .catch(
      ()=>({})
    );


  if(!response.ok){

    throw new Error(
      data.error ||
      ("Server error " +
       response.status)
    );
  }


  return (
    data.reply ||
    "جواب نہیں ملا۔"
  );
}


/* =========================
   SPEAK
========================= */

/*
   اب speak() callback بھی لے گا۔

   یعنی:
   Assistant کی آواز ختم ہونے تک
   اگلا microphone start نہیں ہوگا۔
*/

function speak(text,onDone){

  if(
    !("speechSynthesis" in window)
  ){

    assistantSpeaking=false;

    if(onDone){
      onDone();
    }

    return;
  }


  /*
     پرانی speech ختم کریں
  */

  speechSynthesis.cancel();

  assistantSpeaking=true;


  const utter =
    new SpeechSynthesisUtterance(
      text
    );


  utter.lang =
    "ur-PK";

  utter.rate =
    0.95;

  utter.pitch =
    1;


  utter.onstart =
    function(){

      assistantSpeaking=true;

      status.textContent =
        "🔊 بول رہا ہوں…";
    };


  utter.onend =
    function(){

      assistantSpeaking=false;

      if(onDone){
        onDone();
      }
    };


  utter.onerror =
    function(){

      assistantSpeaking=false;

      if(onDone){
        onDone();
      }
    };


  speechSynthesis.speak(
    utter
  );
}


/* =========================
   AFTER ASSISTANT SPEAKS
========================= */

function afterAssistantSpeech(){

  /*
     اگر Wake Mode بند ہے تو کچھ نہیں کرنا
  */

  if(!wakeMode){
    status.textContent="تیار ہے";
    return;
  }


  /*
     اگر ہم command سننے کے مرحلے میں ہیں
     تو ابھی Wake دوبارہ شروع نہیں کرنا
  */

  if(listening){
    return;
  }


  if(waitingForCommand){

    return;
  }


  /*
     Wake Mode دوبارہ شروع کریں
  */

  status.textContent =
    "تیار ہے";

  wakeStatus.textContent =
    '🟢 Wake Mode ON — "Kamran" کہیں';

  setTimeout(
    function(){

      if(
        wakeMode &&
        !listening &&
        !assistantSpeaking &&
        !wakeListening
      ){

        startWakeRecognition();

      }

    },
    300
  );
}


/* =========================
   SEND
========================= */

async function send(){

  const text =
    msg.value.trim();

  if(!text)return;


  add(
    text,
    "user"
  );

  msg.value="";


  /*
     Local command
  */

  const local =
    localCommand(text);


  if(local){

    add(
      local,
      "bot"
    );

    speak(
      local,
      afterAssistantSpeech
    );

    return;
  }


  status.textContent =
    "AI سوچ رہا ہے…";


  try{

    const reply =
      await ask(text);


    history.push({
      role:"user",
      content:text
    });


    history.push({
      role:"assistant",
      content:reply
    });


    add(
      reply,
      "bot"
    );


    /*
       AI جواب مکمل بولنے کے بعد
       Wake Mode واپس شروع ہوگا
    */

    speak(
      reply,
      afterAssistantSpeech
    );


    status.textContent =
      "تیار ہے";


  }catch(error){

    add(
      "AI سے رابطہ نہیں ہو سکا۔ ⚠️\n"
      + error.message,
      "bot"
    );


    status.textContent =
      "Connection check کریں";


    /*
       Error کے بعد بھی Wake Mode واپس لائیں
    */

    if(wakeMode){

      setTimeout(
        afterAssistantSpeech,
        500
      );

    }

  }
}


/* =========================
   ENTER
========================= */

msg.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      send();
    }

  }
);


/* =========================
   SPEECH RECOGNITION
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* =========================
   NORMAL COMMAND RECOGNITION
========================= */

if(SpeechRecognition){

  recognition =
    new SpeechRecognition();


  /*
     اردو + انگریزی دونوں میں بہتر
     command recognition
  */

  recognition.lang =
    "ur-PK";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onstart =
    function(){

      listening=true;

      status.textContent =
        "🎙️ سن رہا ہوں…";

      document
        .getElementById("mic")
        .textContent =
        "🔴";
    };


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0]
        .transcript
        .trim();


      console.log(
        "Command heard:",
        text
      );


      msg.value =
        text;


      /*
         Recognition پہلے ہی command
         مکمل کر چکا ہے۔
      */

      send();
    };


  recognition.onerror =
    function(event){

      console.log(
        "Command Voice error:",
        event.error
      );

      listening=false;

      document
        .getElementById("mic")
        .textContent =
        "🎙️";

      /*
         aborted / no-speech کو
         unnecessary error نہ دکھائیں
      */

      if(
        event.error === "aborted" ||
        event.error === "no-speech"
      ){

        if(wakeMode){

          status.textContent =
            "Wake Mode تیار ہے";

        }else{

          status.textContent =
            "تیار ہے";
        }

        return;
      }


      status.textContent =
        "Voice error: " +
        event.error;
    };


  recognition.onend =
    function(){

      listening=false;

      document
        .getElementById("mic")
        .textContent =
        "🎙️";


      /*
         Wake Mode میں فوراً Wake recognition
         شروع نہیں کرنی۔
         
         Assistant کی speech ختم ہونے کے بعد
         afterAssistantSpeech() اسے شروع کرے گا۔
      */

      if(
        wakeMode &&
        !assistantSpeaking &&
        !waitingForCommand
      ){

        setTimeout(
          function(){

            if(
              wakeMode &&
              !listening &&
              !assistantSpeaking &&
              !wakeListening
            ){

              startWakeRecognition();

            }

          },
          300
        );

      }else if(!wakeMode){

        status.textContent =
          "تیار ہے";
      }
    };
}


/* =========================
   START NORMAL LISTENING
========================= */

function startListening(){

  if(!recognition){

    alert(
      "آپ کے browser میں Voice Recognition support نہیں ہے۔"
    );

    return;
  }


  /*
     اگر Wake recognition چل رہی ہے
     تو پہلے اسے بند کریں۔
  */

  if(wakeListening){

    try{

      wakeRecognition.stop();

    }catch(e){}

    wakeListening=false;
  }


  /*
     Wake Mode میں manually command سننے
     کے لیے بھی waitingForCommand true کریں۔
  */

  if(wakeMode){

    waitingForCommand=true;
  }


  /*
     اگر Assistant ابھی بول رہا ہے تو
     microphone شروع نہ کریں۔
  */

  if(assistantSpeaking){

    console.log(
      "Assistant ابھی بول رہا ہے۔"
    );

    return;
  }


  if(listening){

    try{

      recognition.stop();

    }catch(e){}

    return;
  }


  /*
     Speech synthesis مکمل طور پر بند کریں۔
  */

  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

  }


  try{

    recognition.start();

  }catch(error){

    console.log(
      "Recognition start:",
      error
    );

  }
}


/* =========================
   WAKE WORD NORMALIZER
========================= */

function normalizeWakeText(text){

  return text
    .toLowerCase()
    .replace(/[.,!?،۔؟]/g," ")
    .replace(/\s+/g," ")
    .trim();
}


/* =========================
   CHECK KAMRAN
========================= */

function isKamran(text){

  const t =
    normalizeWakeText(text);


  /*
     مختلف ممکنہ recognition results
  */

  const patterns = [

    "کامران",

    "کمران",

    "کام ر ان",

    "kamran",

    "kam ran",

    "camran",

    "cam ran",

    "kamron",

    "کامر ان"

  ];


  for(
    const p of patterns
  ){

    if(
      t.includes(p)
    ){

      return true;
    }
  }


  return false;
}


/* =========================
   CREATE WAKE RECOGNITION
========================= */

function createWakeRecognition(){

  if(!SpeechRecognition){
    return null;
  }


  const r =
    new SpeechRecognition();


  r.lang =
    "ur-PK";


  r.continuous =
    true;


  r.interimResults =
    false;


  r.onstart =
    function(){

      wakeListening=true;

      wakeStatus.textContent =
        '🟢 Wake Mode ON — "Kamran" کہیں';
    };


  r.onresult =
    function(event){

      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        if(
          !event.results[i].isFinal
        ){
          continue;
        }


        const heard =
          event.results[i][0]
          .transcript
          .trim();


        console.log(
          "Wake heard:",
          heard
        );


        /*
           Kamran ملا؟
        */

        if(
          isKamran(heard)
        ){

          console.log(
            "WAKE WORD DETECTED!"
          );


          /*
             command listening phase شروع
          */

          waitingForCommand=true;


          wakeStatus.textContent =
            "👂 جی کامران، میں سن رہا ہوں…";


          /*
             Wake recognition فوراً stop
          */

          try{

            r.stop();

          }catch(e){}


          /*
             اب اہم چیز:

             پہلے Assistant بولے گا۔
             اس کی آواز ختم ہونے کے بعد
             startListening() ہوگا۔
          */

          speak(
            "جی، میں سن رہا ہوں۔",
            function(){

              if(
                wakeMode &&
                waitingForCommand &&
                !listening
              ){

                /*
                   Assistant کی آواز مکمل ختم ہو چکی ہے
                */

                setTimeout(
                  function(){

                    if(
                      wakeMode &&
                      !listening
                    ){

                      startListening();

                    }

                  },
                  250
                );

              }

            }
          );


          return;
        }
      }
    };


  r.onerror =
    function(event){

      console.log(
        "Wake error:",
        event.error
      );


      wakeListening=false;


      /*
         یہ errors عام طور پر browser
         recognition میں آ سکتے ہیں۔
      */

      if(
        event.error === "aborted" ||
        event.error === "no-speech"
      ){

        return;
      }


      /*
         audio-capture error ہو تو
         تھوڑا wait کرکے دوبارہ try کریں
      */

      if(
        wakeMode &&
        !waitingForCommand
      ){

        setTimeout(
          function(){

            if(
              wakeMode &&
              !wakeListening &&
              !listening &&
              !assistantSpeaking
            ){

              startWakeRecognition();

            }

          },
          1000
        );
      }
    };


  r.onend =
    function(){

      wakeListening=false;


      /*
         اگر Wake Word detect ہو چکا ہے
         تو ابھی Wake دوبارہ START نہیں کرنا۔

         Command پہلے سنی جائے گی۔
      */

      if(
        waitingForCommand
      ){

        return;
      }


      /*
         اگر Wake Mode ابھی ON ہے اور
         Assistant نہیں بول رہا تو restart
      */

      if(
        wakeMode &&
        !assistantSpeaking &&
        !listening
      ){

        setTimeout(
          function(){

            if(
              wakeMode &&
              !wakeListening &&
              !listening &&
              !assistantSpeaking &&
              !waitingForCommand
            ){

              startWakeRecognition();

            }

          },
          500
        );
      }
    };


  return r;
}


/* =========================
   START WAKE RECOGNITION
========================= */

function startWakeRecognition(){

  if(!wakeMode){
    return;
  }


  /*
     Command سن رہے ہوں تو Wake نہیں
  */

  if(waitingForCommand){
    return;
  }


  /*
     Assistant بول رہا ہو تو Wake نہیں
  */

  if(assistantSpeaking){
    return;
  }


  /*
     Normal microphone چل رہا ہو تو Wake نہیں
  */

  if(listening){
    return;
  }


  if(wakeListening){
    return;
  }


  wakeRecognition =
    createWakeRecognition();


  if(!wakeRecognition){
    return;
  }


  try{

    wakeRecognition.start();

  }catch(error){

    console.log(
      "Wake start:",
      error
    );

  }
}


/* =========================
   WAKE MODE ON/OFF
========================= */

function toggleWakeMode(){

  if(!SpeechRecognition){

    alert(
      "آپ کے browser میں Voice Recognition support نہیں ہے۔"
    );

    return;
  }


  /*
     ========================
     OFF
     ========================
  */

  if(wakeMode){

    wakeMode=false;

    waitingForCommand=false;


    if(wakeRecognition){

      try{

        wakeRecognition.stop();

      }catch(e){}

    }


    wakeListening=false;


    /*
       اگر command listening چل رہی ہو
       تو اسے بھی بند کریں۔
    */

    if(recognition && listening){

      try{

        recognition.stop();

      }catch(e){}

    }


    listening=false;


    wakeStatus.textContent =
      "Wake Mode بند ہے";


    document
      .getElementById("wakeBtn")
      .textContent =
      "🟢 Wake";


    status.textContent =
      "تیار ہے";


    return;
  }


  /*
     ========================
     ON
     ========================
  */

  wakeMode=true;

  waitingForCommand=false;


  document
    .getElementById("wakeBtn")
    .textContent =
    "🔴 Stop";


  wakeStatus.textContent =
    '🟡 Microphone activate ہو رہا ہے…';


  status.textContent =
    "Wake Mode شروع ہو رہا ہے…";


  /*
     اگر Assistant بول رہا ہے تو
     اس کی آواز ختم ہونے کے بعد Wake start ہوگا۔
  */

  if(assistantSpeaking){

    const waitForSpeech =
      setInterval(
        function(){

          if(!assistantSpeaking){

            clearInterval(
              waitForSpeech
            );

            startWakeRecognition();

          }

        },
        100
      );

    return;
  }


  startWakeRecognition();
}


/* =========================
   PAGE START
========================= */

status.textContent =
  "تیار ہے";

</script>

</body>
</html>
