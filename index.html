<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kamran A1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
  background:#0b1020;
  color:#fff;
}

.app{
  max-width:800px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:18px;
  text-align:center;
  background:#121a30;
  border-bottom:1px solid #293451;
}

header h1{
  margin:0;
  font-size:28px;
}

#status{
  margin-top:8px;
  color:#8bd5ff;
  font-size:14px;
}

.controls{
  display:flex;
  gap:10px;
  padding:12px;
  background:#10172a;
}

button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  cursor:pointer;
  color:white;
  background:#2563eb;
}

button:active{
  transform:scale(.98);
}

#wakeBtn{
  background:#16a34a;
}

#stopBtn{
  background:#dc2626;
}

#chat{
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.msg{
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.7;
  white-space:pre-wrap;
}

.user{
  background:#1d4ed8;
  margin-left:35px;
}

.ai{
  background:#1b263d;
  margin-right:35px;
}

.inputArea{
  display:flex;
  gap:8px;
  padding:12px;
  background:#10172a;
  border-top:1px solid #293451;
}

#textInput{
  flex:1;
  padding:13px;
  border-radius:12px;
  border:1px solid #3b4968;
  background:#0b1020;
  color:white;
  font-size:16px;
  outline:none;
}

#sendBtn{
  flex:0 0 80px;
}

.small{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  padding:8px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🤖 Kamran A1</h1>
  <div id="status">🟢 تیار ہوں</div>
</header>

<div class="controls">
  <button id="wakeBtn">🎙️ Jarvis Wake</button>
  <button id="stopBtn">⛔ Stop</button>
</div>

<div id="chat"></div>

<div class="inputArea">
  <input
    id="textInput"
    type="text"
    placeholder="اپنا سوال لکھیں..."
    autocomplete="off"
  >
  <button id="sendBtn">Send</button>
</div>

<div class="small">
  Wake word: <b>Jarvis</b>
</div>

</div>

<script>
"use strict";

/* ================================
   KAMRAN A1 CONFIG
================================ */

const WORKER_URL =
  "https://kamran1.jeekamran48.workers.dev";

const MEMORY_KEY = "kamran_memory";
const HISTORY_KEY = "kamran_history";

/* ================================
   ELEMENTS
================================ */

const statusEl = document.getElementById("status");
const chatEl = document.getElementById("chat");
const wakeBtn = document.getElementById("wakeBtn");
const stopBtn = document.getElementById("stopBtn");
const sendBtn = document.getElementById("sendBtn");
const textInput = document.getElementById("textInput");

/* ================================
   MEMORY
================================ */

let memory = [];

try {
  memory = JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
  );

  if (!Array.isArray(memory)) {
    memory = [];
  }
} catch(e) {
  memory = [];
}

let history = [];

try {
  history = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  if (!Array.isArray(history)) {
    history = [];
  }
} catch(e) {
  history = [];
}

/* ================================
   SAVE MEMORY
================================ */

function saveMemory(){
  try{
    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(memory.slice(-50))
    );
  }catch(e){}
}

function saveHistory(){
  try{
    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history.slice(-40))
    );
  }catch(e){}
}

/* ================================
   STATUS
================================ */

function setStatus(text){
  statusEl.textContent = text;
}

/* ================================
   CHAT UI
================================ */

function addMessage(text,type){
  const div = document.createElement("div");

  div.className =
    "msg " + (type === "user" ? "user" : "ai");

  div.textContent = text;

  chatEl.appendChild(div);

  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ================================
   SPEECH SYNTHESIS
================================ */

let speaking = false;

function speak(text){
  return new Promise(resolve => {

    if (!("speechSynthesis" in window)) {
      resolve();
      return;
    }

    try{
      window.speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(text);

      utterance.lang = "ur-PK";
      utterance.rate = 0.95;
      utterance.pitch = 1;

      speaking = true;

      utterance.onstart = () => {
        setStatus("🔊 بول رہا ہوں...");
      };

      utterance.onend = () => {
        speaking = false;
        resolve();
      };

      utterance.onerror = () => {
        speaking = false;
        resolve();
      };

      window.speechSynthesis.speak(utterance);

    }catch(e){
      speaking = false;
      resolve();
    }
  });
}

/* ================================
   LOCAL COMMANDS / MEMORY
================================ */

function normalize(text){
  return String(text || "")
    .trim()
    .toLowerCase();
}

function localCommand(text){

  const t = normalize(text);

  /* NAME SAVE */

  const nameMatch =
    text.match(
      /(?:میرا نام|میرا نام ہے|میرا نام یاد رکھو)\s*(?:ہے\s*)?(.+)/i
    );

  if(nameMatch){

    const name =
      nameMatch[1]
        .replace(/[۔.!?؟]+$/,"")
        .trim();

    if(name){

      memory = memory.filter(
        x => x.type !== "name"
      );

      memory.push({
        type:"name",
        value:name
      });

      saveMemory();

      return "ٹھیک ہے، میں نے آپ کا نام یاد رکھ لیا ہے۔";
    }
  }

  /* ASK NAME */

  if(
    t.includes("میرا نام کیا ہے") ||
    t.includes("what is my name") ||
    t.includes("mera naam kya hai")
  ){

    const item =
      memory.find(x => x.type === "name");

    if(item){
      return "آپ کا نام " + item.value + " ہے۔";
    }

    return "آپ نے ابھی تک مجھے اپنا نام نہیں بتایا۔";
  }

  /* REMEMBER COMMAND */

  const rememberMatch =
    text.match(
      /یاد رکھو\s+(.+)/i
    );

  if(rememberMatch){

    const value =
      rememberMatch[1]
        .replace(/[۔.!?؟]+$/,"")
        .trim();

    if(value){

      memory.push({
        type:"note",
        value:value
      });

      saveMemory();

      return "ٹھیک ہے، میں نے یہ بات یاد رکھ لی ہے۔";
    }
  }

  return null;
}

/* ================================
   AI REQUEST
================================ */

async function askAI(text){

  const response = await fetch(
    WORKER_URL + "/chat",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:text,

        memory:
          memory.slice(-12),

        history:
          history.slice(-20)
      })
    }
  );

  let data = {};

  try{
    data = await response.json();
  }catch(e){
    data = {};
  }

  if(!response.ok){

    throw new Error(
      data.error ||
      ("Worker HTTP " + response.status)
    );
  }

  if(
    !data ||
    typeof data.reply !== "string" ||
    !data.reply.trim()
  ){

    throw new Error(
      "Worker نے جواب نہیں دیا۔"
    );
  }

  return data.reply.trim();
}

/* ================================
   SEND MESSAGE
================================ */

let sending = false;

async function sendMessage(text){

  text = String(text || "").trim();

  if(!text || sending){
    return;
  }

  sending = true;

  addMessage(text,"user");

  setStatus("🤔 سوچ رہا ہوں...");

  let reply = null;

  try{

    /* FIRST LOCAL COMMAND */

    reply = localCommand(text);

    /* OTHERWISE AI */

    if(!reply){
      reply = await askAI(text);
    }

    addMessage(reply,"ai");

    history.push({
      role:"user",
      content:text
    });

    history.push({
      role:"assistant",
      content:reply
    });

    saveHistory();

    setStatus("🟢 تیار ہوں");

    await speak(reply);

  }catch(error){

    console.error(error);

    const msg =
      "AI سے رابطہ نہیں ہو سکا۔ ⚠️\n" +
      error.message;

    addMessage(msg,"ai");

    setStatus("🔴 مسئلہ آیا");

  }finally{

    sending = false;

    if(!wakeRunning){
      setStatus("🟢 تیار ہوں");
    }
  }
}

/* ================================
   MANUAL SEND
================================ */

sendBtn.addEventListener(
  "click",
  () => {

    const text =
      textInput.value.trim();

    if(!text) return;

    textInput.value = "";

    sendMessage(text);
  }
);

textInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      event.preventDefault();
      sendBtn.click();
    }
  }
);

/* ================================
   SPEECH RECOGNITION
================================ */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let wakeRecognition = null;
let commandRecognition = null;

let wakeRunning = false;
let commandRunning = false;
let stopping = false;

/* ================================
   JARVIS DETECTION
================================ */

function isJarvis(text){

  const t =
    normalize(text)
      .replace(/[.,!?؟،]/g," ")
      .replace(/\s+/g," ")
      .trim();

  const patterns = [

    "jarvis",
    "jar viz",
    "jar vis",
    "jarwis",
    "jarvish",
    "jervis",
    "jervish",

    "جاروِس",
    "جاروس",
    "جارو س",
    "جار وس",
    "جارس"
  ];

  return patterns.some(
    word => t.includes(word)
  );
}

/* ================================
   START COMMAND LISTENER
================================ */

function startCommandListening(){

  if(!SpeechRecognition){
    setStatus(
      "⚠️ اس browser میں voice recognition موجود نہیں"
    );
    return;
  }

  if(stopping){
    return;
  }

  if(commandRunning){
    return;
  }

  try{

    commandRecognition =
      new SpeechRecognition();

    commandRecognition.lang = "ur-PK";
    commandRecognition.continuous = false;
    commandRecognition.interimResults = false;
    commandRecognition.maxAlternatives = 5;

    commandRunning = true;

    setStatus("🎤 میں سن رہا ہوں...");

    commandRecognition.onresult =
      event => {

        let text = "";

        for(
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ){

          if(
            event.results[i].isFinal
          ){

            text +=
              event.results[i][0].transcript;
          }
        }

        text = text.trim();

        if(text){

          commandRunning = false;

          try{
            commandRecognition.stop();
          }catch(e){}

          sendMessage(text);
        }
      };

    commandRecognition.onerror =
      event => {

        console.log(
          "Command recognition:",
          event.error
        );

        commandRunning = false;

        if(!stopping && wakeRunning){
          setStatus("👂 Jarvis سن رہا ہے...");
        }
      };

    commandRecognition.onend =
      () => {

        commandRunning = false;

        if(!stopping && wakeRunning){
          setStatus("👂 Jarvis سن رہا ہے...");
        }
      };

    commandRecognition.start();

  }catch(error){

    commandRunning = false;

    console.log(error);

    if(wakeRunning){
      setStatus("👂 Jarvis سن رہا ہے...");
    }
  }
}

/* ================================
   JARVIS DETECTED
================================ */

async function jarvisDetected(){

  if(stopping){
    return;
  }

  /* stop wake listener */

  if(wakeRecognition){

    try{
      wakeRecognition.stop();
    }catch(e){}
  }

  wakeRunning = false;

  /* wake response */

  setStatus("🟢 Jarvis فعال");

  await speak(
    "جی، میں سن رہا ہوں۔"
  );

  if(stopping){
    return;
  }

  /* now listen for command */

  startCommandListening();
}

/* ================================
   START WAKE MODE
================================ */

async function startWakeMode(){

  if(!SpeechRecognition){

    alert(
      "آپ کے browser میں Speech Recognition موجود نہیں ہے۔ Chrome استعمال کریں۔"
    );

    return;
  }

  if(wakeRunning){
    return;
  }

  stopping = false;

  /* microphone permission */

  try{

    if(
      navigator.mediaDevices &&
      navigator.mediaDevices.getUserMedia
    ){

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });

      stream.getTracks().forEach(
        track => track.stop()
      );
    }

  }catch(error){

    alert(
      "Microphone permission نہیں ملی۔ براہِ کرم microphone Allow کریں۔"
    );

    return;
  }

  try{

    wakeRecognition =
      new SpeechRecognition();

    /*
      English recognition is used here because
      Jarvis is an English wake word.
    */

    wakeRecognition.lang = "en-US";

    wakeRecognition.continuous = true;
    wakeRecognition.interimResults = false;
    wakeRecognition.maxAlternatives = 5;

    wakeRecognition.onstart =
      () => {

        wakeRunning = true;

        setStatus(
          "👂 Jarvis سن رہا ہے..."
        );
      };

    wakeRecognition.onresult =
      event => {

        for(
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ){

          if(
            !event.results[i].isFinal
          ){
            continue;
          }

          let text =
            event.results[i][0].transcript
              .trim();

          console.log(
            "Wake heard:",
            text
          );

          if(isJarvis(text)){

            jarvisDetected();

            return;
          }
        }
      };

    wakeRecognition.onerror =
      event => {

        console.log(
          "Wake recognition error:",
          event.error
        );

        /*
          Some browsers automatically stop
          recognition. We restart it below.
        */

        if(
          event.error === "not-allowed" ||
          event.error === "service-not-allowed"
        ){

          wakeRunning = false;

          setStatus(
            "⚠️ Microphone permission مسئلہ"
          );

          return;
        }
      };

    wakeRecognition.onend =
      () => {

        wakeRunning = false;

        if(
          !stopping &&
          !commandRunning
        ){

          setTimeout(
            () => {

              if(
                !stopping &&
                !wakeRunning
              ){

                try{
                  wakeRecognition.start();
                }catch(e){}
              }

            },
            500
          );
        }
      };

    wakeRecognition.start();

    setStatus(
      "👂 Jarvis سن رہا ہے..."
    );

  }catch(error){

    console.error(error);

    wakeRunning = false;

    setStatus(
      "⚠️ Wake Mode شروع نہیں ہوا"
    );
  }
}

/* ================================
   STOP EVERYTHING
================================ */

function stopEverything(){

  stopping = true;

  wakeRunning = false;
  commandRunning = false;

  if(wakeRecognition){

    try{
      wakeRecognition.stop();
    }catch(e){}
  }

  if(commandRecognition){

    try{
      commandRecognition.stop();
    }catch(e){}
  }

  if("speechSynthesis" in window){

    try{
      speechSynthesis.cancel();
    }catch(e){}
  }

  setStatus("⛔ سب بند ہے");
}

/* ================================
   BUTTONS
================================ */

wakeBtn.addEventListener(
  "click",
  startWakeMode
);

stopBtn.addEventListener(
  "click",
  stopEverything
);

/* ================================
   INITIAL CHAT
================================ */

if(history.length){

  for(
    const item of history.slice(-20)
  ){

    if(
      item &&
      item.role === "user" &&
      item.content
    ){

      addMessage(
        item.content,
        "user"
      );

    }else if(
      item &&
      item.role === "assistant" &&
      item.content
    ){

      addMessage(
        item.content,
        "ai"
      );
    }
  }

}else{

  addMessage(
    "السلام علیکم کامران! میں Kamran A1 ہوں۔\n\nآپ مجھے text سے سوال پوچھ سکتے ہیں یا اوپر سے Jarvis Wake آن کر سکتے ہیں۔",
    "ai"
  );
}

/* ================================
   READY
================================ */

setStatus("🟢 تیار ہوں");

</script>

</body>
</html>
