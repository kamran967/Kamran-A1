<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kamran A1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
}

header{
  padding:18px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

#status{
  text-align:center;
  color:#8aa0b8;
  padding:8px;
  font-size:14px;
}

#wakeStatus{
  text-align:center;
  color:#22c55e;
  font-size:13px;
  padding-bottom:6px;
}

#chat{
  height:calc(100vh - 220px);
  overflow-y:auto;
  padding:15px;
}

.msg{
  max-width:85%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:15px;
  white-space:pre-wrap;
  line-height:1.6;
}

.user{
  background:#164e63;
  margin-right:auto;
}

.bot{
  background:#1e293b;

.bottom{
  position:fixed;

  flex:1;

}

button{
  border:0;
  border-radius:12px;
  padding:11px 13px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#mic{
  background:#16a34a;
}

#wakeBtn{
  background:#15803d;
}

#settings{
  position:fixed;
  top:65px;
  right:10px;
  left:10px;
  background:#111827;
  border:1px solid #334155;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:100;
}

#settings h3{
  margin-top:0;
}

#settings input{
  width:100%;
  margin-bottom:10px;
}

.smallBtn{
  margin-top:5px;
  background:#475569;
}
</style>
</head>

<body>

<header>
  Kamran A1 🤖

  <button
    onclick="toggleSettings()"
    style="float:left;background:#334155;padding:7px 10px;"
  >
    ⚙️
  </button>
</header>

<div id="status">
  تیار ہے
</div>

<div id="wakeStatus">
  Wake Mode بند ہے
</div>

<div id="chat"></div>

<div class="bottom">

  <input
    id="msg"
    placeholder="اپنا پیغام لکھیں..."
    autocomplete="off"
  >

  <button
    id="wakeBtn"
    onclick="toggleWakeMode()"
  >
    🟢 Wake
  </button>

  <button
    id="mic"
    onclick="startListening()"
  >
    🎙️
  </button>

  <button onclick="send()">
    ➤
  </button>

</div>

<div id="settings">

  <h3>⚙️ Kamran A1 Settings</h3>

  <label>Worker URL</label>

  <input
    id="workerUrl"
    placeholder="https://your-worker.workers.dev"
  >

  <button onclick="saveSettings()">
    💾 Save
  </button>

  <button
    class="smallBtn"
    onclick="clearMemory()"
  >
    🧠 Clear Memory
  </button>

  <button
    class="smallBtn"
    onclick="toggleSettings()"
  >
    بند کریں
  </button>

</div>

<script>

/* =====================================================
   SETTINGS / VARIABLES
===================================================== */

const WORKER_URL =
  "https://kamran1.jeekamran48.workers.dev";

const workerKey =
  "kamran_a1_worker";

const memoryKey =
  "kamran_memory";

let mem = [];
let history = [];

try{

  mem =
    JSON.parse(
      localStorage.getItem(memoryKey) || "[]"
    );

  if(!Array.isArray(mem)){
    mem = [];
  }

}catch(e){

  mem = [];
}

let recognition = null;
let wakeRecognition = null;

let listening = false;
let wakeListening = false;

let wakeMode = false;
let processing = false;

let voiceState = "idle";

let wakeRestartTimer = null;
let commandTimer = null;

const chat =
  document.getElementById("chat");

const msg =
  document.getElementById("msg");

const status =
  document.getElementById("status");

const wakeStatus =
  document.getElementById("wakeStatus");

const workerUrl =
  document.getElementById("workerUrl");

const micButton =
  document.getElementById("mic");

const wakeButton =
  document.getElementById("wakeBtn");


/* =====================================================
   WORKER URL
===================================================== */

if(!localStorage.getItem(workerKey)){

  localStorage.setItem(
    workerKey,
    WORKER_URL
  );
}

workerUrl.value =
  localStorage.getItem(workerKey) ||
  WORKER_URL;


/* =====================================================
   SETTINGS
===================================================== */

function toggleSettings(){

  const box =
    document.getElementById("settings");

  box.style.display =
    box.style.display === "block"
      ? "none"
      : "block";
}


function saveSettings(){

  let url =
    workerUrl.value.trim();

  url =
    url.replace(/\/+$/,"");

  if(!url){

    status.textContent =
      "Worker URL خالی ہے۔";

    return;
  }

  localStorage.setItem(
    workerKey,
    url
  );

  status.textContent =
    "Worker URL محفوظ ہو گیا ✅";

  setTimeout(function(){

    if(!processing){
      status.textContent =
        "تیار ہے";
    }

  },1500);
}


/* =====================================================
   MEMORY
===================================================== */

function saveMemory(){

  try{

    localStorage.setItem(
      memoryKey,
      JSON.stringify(mem)
    );

  }catch(e){

    console.log(e);
  }
}


function clearMemory(){

  mem = [];

  saveMemory();

  add(
    "Memory صاف کر دی گئی ہے۔ 🧠",
    "bot"
  );

  speak(
    "Memory صاف کر دی گئی ہے۔"
  );
}


/* =====================================================
   CHAT
===================================================== */

function add(text,type){

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.textContent =
    String(text || "");

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =====================================================
   CLEAN TEXT
===================================================== */

function cleanText(text){

  return String(text || "")
    .trim()
    .replace(/[۔؟?.,،!！]/g,"")
    .replace(/\s+/g," ");
}


/* =====================================================
   LOCAL MEMORY COMMANDS
===================================================== */

function localCommand(originalText){

  const text =
    cleanText(originalText);

  const lower =
    text.toLowerCase();


  /* NAME QUESTION */

  if(
    text.includes("میرا نام") &&
    (
      text.includes("کیا ہے") ||
      text.includes("کون ہے") ||
      text.includes("بتاؤ") ||
      text.includes("بتاو") ||
      text.includes("یاد ہے")
    )
  ){

    const savedName =
      mem.find(function(x){

        return x &&
          x.type === "name";
      });

    if(
      savedName &&
      savedName.value
    ){

      return {
        reply:
          "آپ کا نام " +
          savedName.value +
          " ہے۔",

        handled:true
      };
    }

    return {
      reply:
        "آپ کا نام ابھی Memory میں محفوظ نہیں ہے۔",

      handled:true
    };
  }


  /* ENGLISH NAME QUESTION */

  if(
    lower === "what is my name" ||
    lower === "whats my name" ||
    lower === "do you know my name"
  ){

    const savedName =
      mem.find(function(x){

        return x &&
          x.type === "name";
      });

    if(
      savedName &&
      savedName.value
    ){

      return {
        reply:
          "Your name is " +
          savedName.value +
          ".",

        handled:true
      };
    }

    return {
      reply:
        "I don't have your name saved yet.",

      handled:true
    };
  }


  /* SAVE URDU NAME */

  if(
    text.startsWith("میرا نام ")
  ){

    let name = "";

    let match =
      text.match(
        /^میرا نام\s+(.+?)\s+ہے$/i
      );

    if(match){
      name =
        match[1].trim();
    }

    if(!name){

      match =
        text.match(
          /^میرا نام\s+(.+)$/i
        );

      if(match){
        name =
          match[1].trim();
      }
    }

    name =
      name
        .replace(
          /^(سیو کرلو|save کرلو|یاد رکھو|یاد کرلو)\s*/i,
          ""
        )
        .replace(
          /\s+ہے$/i,
          ""
        )
        .trim();

    if(
      name &&
      name !== "کیا ہے" &&
      name !== "کون ہے" &&
      name !== "بتاؤ" &&
      name !== "بتاو"
    ){

      mem =
        mem.filter(function(x){

          return x.type !== "name";
        });

      mem.push({
        type:"name",
        value:name
      });

      saveMemory();

      return {
        reply:
          "ٹھیک ہے، میں آپ کا نام یاد رکھوں گا: " +
          name,

        handled:true
      };
    }
  }


  /* SAVE ENGLISH NAME */

  const englishName =
    lower.match(
      /^my name is\s+(.+)$/i
    );

  if(englishName){

    const name =
      englishName[1].trim();

    if(name){

      mem =
        mem.filter(function(x){

          return x.type !== "name";
        });

      mem.push({
        type:"name",
        value:name
      });

      saveMemory();

      return {
        reply:
          "Okay, I will remember your name: " +
          name,

        handled:true
      };
    }
  }


  /* GENERAL MEMORY */

  if(
    text.startsWith("یاد رکھو")
  ){

    const value =
      text
        .replace(
          /^یاد رکھو[:：]?\s*/,
          ""
        )
        .trim();

    if(value){

      mem.push({
        type:"note",
        value:value
      });

      saveMemory();

      return {
        reply:
          "ٹھیک ہے، یہ بات Memory میں محفوظ کر لی ہے۔",

        handled:true
      };
    }
  }


  return {
    handled:false
  };
}


/* =====================================================
   AI
===================================================== */

async function ask(text){

  const baseUrl =
    (
      localStorage.getItem(workerKey) ||
      WORKER_URL
    ).replace(/\/+$/,"");

  if(!baseUrl){

    throw new Error(
      "Worker URL محفوظ نہیں ہے۔"
    );
  }

  const response =
    await fetch(
      baseUrl + "/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            message:text,

            memory:
              mem.slice(-12),

            history:
              history.slice(-20)

          })
      }
    );

  const data =
    await response
      .json()
      .catch(function(){
        return {};
      });

  if(!response.ok){

    throw new Error(
      data.error ||
      "Server error " +
      response.status
    );
  }

  if(!data.reply){

    throw new Error(
      "Worker نے جواب نہیں دیا۔"
    );
  }

  return String(
    data.reply
  );
}


/* =====================================================
   SPEECH
===================================================== */

function speak(text,done){

  const speechText =
    String(text || "").trim();

  if(!speechText){

    if(done){
      done();
    }

    return;
  }

  if(
    !("speechSynthesis" in window)
  ){

    if(done){
      done();
    }

    return;
  }

  try{
    speechSynthesis.cancel();
  }catch(e){}

  voiceState =
    "speaking";

  status.textContent =
    "🔊 بول رہا ہوں…";

  const utter =
    new SpeechSynthesisUtterance(
      speechText
    );

  utter.lang =
    "ur-PK";

  utter.rate =
    0.95;

  utter.pitch =
    1;

  let finished = false;

  function finish(){

    if(finished){
      return;
    }

    finished = true;

    voiceState =
      "idle";

    if(done){

      setTimeout(
        done,
        350
      );
    }
  }

  utter.onend =
    finish;

  utter.onerror =
    finish;

  speechSynthesis.speak(
    utter
  );
}


/* =====================================================
   SEND
===================================================== */

async function send(){

  const text =
    msg.value.trim();

  if(!text || processing){
    return;
  }

  processing = true;

  add(
    text,
    "user"
  );

  msg.value = "";

  const local =
    localCommand(text);

  if(local.handled){

    add(
      local.reply,
      "bot"
    );

    speak(
      local.reply,
      function(){

        processing = false;

        if(wakeMode){

          afterSpeech();

        }else{

          status.textContent =
            "تیار ہے";
        }
      }
    );

    return;
  }


  status.textContent =
    "AI سوچ رہا ہے…";


  try{

    const reply =
      await ask(text);


    history.push({
      role:"user",
      content:text
    });


    history.push({
      role:"assistant",
      content:reply
    });


    history =
      history.slice(-20);


    add(
      reply,
      "bot"
    );


    speak(
      reply,
      function(){

        processing = false;

        if(wakeMode){

          afterSpeech();

        }else{

          status.textContent =
            "تیار ہے";
        }
      }
    );


  }catch(error){

    console.log(
      "AI ERROR:",
      error
    );

    add(
      "AI سے رابطہ نہیں ہو سکا۔ ⚠️\n" +
      error.message,
      "bot"
    );

    processing = false;

    if(wakeMode){

      voiceState =
        "wake";

      status.textContent =
        '👂 "Jarvis" سن رہا ہوں…';

      scheduleWakeRestart(
        1000
      );

    }else{

      status.textContent =
        "Connection check کریں";
    }
  }
}


/* =====================================================
   ENTER
===================================================== */

msg.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      send();
    }
  }
);


/* =====================================================
   SPEECH API
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* =====================================================
   COMMAND RECOGNITION
===================================================== */

function createCommandRecognition(){

  if(!SpeechRecognition){
    return null;
  }

  const r =
    new SpeechRecognition();

  r.lang =
    "ur-PK";

  r.continuous =
    false;

  r.interimResults =
    false;

  r.maxAlternatives =
    5;


  r.onstart =
    function(){

      listening = true;

      voiceState =
        "command";

      status.textContent =
        "🎙️ سوال سن رہا ہوں…";

      micButton.textContent =
        "🔴";
    };


  r.onresult =
    function(event){

      let text = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        if(
          event.results[i].isFinal
        ){

          text +=
            " " +
            event.results[i][0]
              .transcript;
        }
      }

      text =
        text.trim();

      console.log(
        "COMMAND:",
        text
      );

      listening = false;

      micButton.textContent =
        "🎙️";


      if(!text){

        if(wakeMode){

          afterSpeech();
        }

        return;
      }


      msg.value =
        text;

      send();
    };


  r.onerror =
    function(event){

      console.log(
        "COMMAND ERROR:",
        event.error
      );

      listening = false;

      micButton.textContent =
        "🎙️";


      if(wakeMode){

        voiceState =
          "wake";

        scheduleWakeRestart(
          700
        );

      }else{

        status.textContent =
          "Voice دوبارہ try کریں۔";
      }
    };


  r.onend =
    function(){

      listening = false;

      micButton.textContent =
        "🎙️";


      if(
        voiceState === "processing" ||
        voiceState === "speaking"
      ){

        return;
      }


      if(wakeMode){

        if(
          !processing &&
          voiceState === "command"
        ){

          scheduleWakeRestart(
            500
          );
        }

      }else{

        status.textContent =
          "تیار ہے";
      }
    };

  return r;
}


if(SpeechRecognition){

  recognition =
    createCommandRecognition();
}


/* =====================================================
   MANUAL MIC
===================================================== */

function startListening(){

  if(!recognition){

    alert(
      "آپ کے browser میں Voice Recognition support نہیں ہے۔"
    );

    return;
  }

  if(processing){
    return;
  }


  stopWakeRecognition();


  try{
    speechSynthesis.cancel();
  }catch(e){}


  voiceState =
    "command";


  status.textContent =
    "🎙️ سن رہا ہوں…";


  try{

    recognition.start();

  }catch(e){

    console.log(
      "Manual recognition:",
      e
    );
  }
}


/* =====================================================
   JARVIS DETECTION
===================================================== */

function normalizeWakeText(text){

  return String(text || "")
    .toLowerCase()
    .replace(/[.,!?،۔؟]/g," ")
    .replace(/\s+/g," ")
    .trim();
}


function isJarvis(text){

  const t =
    normalizeWakeText(text);

  if(!t){
    return false;
  }


  /*
    صرف Jarvis کے variations
  */

  const patterns = [

    "jarvis",
    "jar viz",
    "jar vis",
    "jarwis",
    "jarvish",
    "jervis",
    "jervish",

    "جاروِس",
    "جاروس",
    "جارو س",
    "جار وس"

  ];


  for(
    const pattern of patterns
  ){

    if(
      t.includes(pattern)
    ){

      return true;
    }
  }


  const compact =
    t.replace(/\s+/g,"");


  return (
    compact.includes("jarvis") ||
    compact.includes("jarwis") ||
    compact.includes("jervis") ||
    compact.includes("جاروس") ||
    compact.includes("جاروِس")
  );
}


/* =====================================================
   WAKE RECOGNITION
===================================================== */

function createWakeRecognition(){

  if(!SpeechRecognition){
    return null;
  }

  const r =
    new SpeechRecognition();


  /*
    Jarvis English word ہے۔
    اس لیے wake listener English رکھیں۔
  */

  r.lang =
    "en-US";

  r.continuous =
    true;

  r.interimResults =
    false;

  r.maxAlternatives =
    5;


  r.onstart =
    function(){

      wakeListening = true;

      voiceState =
        "wake";

      status.textContent =
        '👂 "Jarvis" سن رہا ہوں…';

      wakeStatus.textContent =
        '🟢 Wake Mode ON — صرف "Jarvis" کہیں';
    };


  r.onresult =
    function(event){

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        if(
          !event.results[i].isFinal
        ){
          continue;
        }


        const result =
          event.results[i];


        for(
          let j = 0;
          j < result.length;
          j++
        ){

          const text =
            result[j]
              .transcript
              .trim();


          console.log(
            "WAKE WORD:",
            text
          );


          /*
            یہاں صرف Jarvis check ہوگا۔
            کوئی اور لفظ command نہیں بنے گا۔
          */

          if(
            isJarvis(text)
          ){

            jarvisDetected();

            return;
          }
        }
      }
    };


  r.onerror =
    function(event){

      console.log(
        "WAKE ERROR:",
        event.error
      );

      wakeListening = false;


      if(!wakeMode){
        return;
      }


      if(
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ){

        wakeStatus.textContent =
          "🔴 Microphone permission دیں";

        status.textContent =
          "Microphone Allow کریں۔";

        return;
      }


      scheduleWakeRestart(
        1000
      );
    };


  r.onend =
    function(){

      wakeListening = false;


      if(!wakeMode){
        return;
      }


      if(
        voiceState === "speaking" ||
        voiceState === "command" ||
        voiceState === "processing"
      ){

        return;
      }


      scheduleWakeRestart(
        500
      );
    };


  return r;
}


if(SpeechRecognition){

  wakeRecognition =
    createWakeRecognition();
}


/* =====================================================
   JARVIS DETECTED
===================================================== */

function jarvisDetected(){

  if(!wakeMode){
    return;
  }

  if(processing){
    return;
  }


  /*
    Wake listener فوراً بند۔
    تاکہ Jarvis دوبارہ command میں نہ جائے۔
  */

  stopWakeRecognition();


  voiceState =
    "speaking";


  status.textContent =
    "👋 Jarvis detected";


  speak(
    "جی، میں سن رہا ہوں۔",
    function(){

      if(!wakeMode){
        return;
      }

      startCommandAfterJarvis();
    }
  );
}


/* =====================================================
   COMMAND AFTER JARVIS
===================================================== */

function startCommandAfterJarvis(){

  if(!wakeMode){
    return;
  }

  if(!recognition){
    return;
  }


  voiceState =
    "command";


  status.textContent =
    "🎙️ جی، سوال بولیں…";


  clearTimeout(
    commandTimer
  );


  commandTimer =
    setTimeout(
      function(){

        if(
          !wakeMode ||
          processing ||
          listening
        ){

          return;
        }


        try{

          recognition.start();

        }catch(error){

          console.log(
            "COMMAND START ERROR:",
            error
          );


          setTimeout(
            function(){

              if(
                wakeMode &&
                !processing &&
                !listening
              ){

                try{

                  recognition.start();

                }catch(e){

                  console.log(e);

                  scheduleWakeRestart(
                    700
                  );
                }
              }

            },
            600
          );
        }

      },
      500
    );
}


/* =====================================================
   AFTER AI SPEECH
===================================================== */

function afterSpeech(){

  if(!wakeMode){

    processing = false;

    voiceState =
      "idle";

    status.textContent =
      "تیار ہے";

    return;
  }


  processing = false;

  voiceState =
    "wake";


  status.textContent =
    '👂 "Jarvis" سن رہا ہوں…';


  wakeStatus.textContent =
    '🟢 Wake Mode ON — صرف "Jarvis" کہیں';


  scheduleWakeRestart(
    600
  );
}


/* =====================================================
   WAKE TIMER
===================================================== */

function clearWakeRestart(){

  if(wakeRestartTimer){

    clearTimeout(
      wakeRestartTimer
    );

    wakeRestartTimer = null;
  }
}


function scheduleWakeRestart(delay){

  clearWakeRestart();


  if(!wakeMode){
    return;
  }


  wakeRestartTimer =
    setTimeout(
      function(){

        wakeRestartTimer =
          null;

        startWakeRecognition();

      },
      delay
    );
}


/* =====================================================
   START WAKE
===================================================== */

function startWakeRecognition(){

  if(!wakeMode){
    return;
  }

  if(!wakeRecognition){
    return;
  }


  if(
    wakeListening ||
    listening ||
    processing ||
    voiceState === "speaking"
  ){

    return;
  }


  try{

    wakeRecognition.start();

  }catch(error){

    console.log(
      "WAKE START:",
      error
    );


    wakeListening = false;


    setTimeout(
      function(){

        if(
          wakeMode &&
          !wakeListening &&
          !listening &&
          !processing
        ){

          try{

            wakeRecognition.start();

          }catch(e){

            console.log(e);
          }
        }

      },
      1000
    );
  }
}


/* =====================================================
   STOP WAKE
===================================================== */

function stopWakeRecognition(){

  clearWakeRestart();

  wakeListening = false;


  if(wakeRecognition){

    try{

      wakeRecognition.stop();

    }catch(e){}
  }
}


/* =====================================================
   WAKE MODE
===================================================== */

async function toggleWakeMode(){

  if(wakeMode){

    wakeMode = false;

    processing = false;

    voiceState =
      "idle";


    stopWakeRecognition();


    if(recognition){

      try{

        recognition.stop();

      }catch(e){}
    }


    try{
      speechSynthesis.cancel();
    }catch(e){}


    wakeButton.textContent =
      "🟢 Wake";


    wakeStatus.textContent =
      "Wake Mode بند ہے";


    status.textContent =
      "تیار ہے";


    return;
  }


  if(!SpeechRecognition){

    alert(
      "آپ کے browser میں Voice Recognition موجود نہیں ہے۔"
    );

    return;
  }


  /*
    پہلے microphone permission
  */

  try{

    if(
      navigator.mediaDevices &&
      navigator.mediaDevices.getUserMedia
    ){

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });


      stream
        .getTracks()
        .forEach(function(track){

          track.stop();
        });
    }

  }catch(error){

    console.log(
      "MIC PERMISSION:",
      error
    );


    wakeStatus.textContent =
      "🔴 Microphone permission دیں";


    status.textContent =
      "Microphone Allow کریں۔";


    return;
  }


  wakeMode = true;

  processing = false;

  voiceState =
    "wake";


  wakeButton.textContent =
    "🔴 Stop";


  wakeStatus.textContent =
    '🟢 Wake Mode ON — صرف "Jarvis" کہیں';


  status.textContent =
    '👂 "Jarvis" سن رہا ہوں…';


  startWakeRecognition();
}

    status.textContent =

    wakeStatus.textContent =

      خود start کرنے کی اجازت نہ دے تو
      Wake button ایک دفعہ دبانا پڑے گا۔
    */

  }
);
